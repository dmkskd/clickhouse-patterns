title: Kafka → ClickHouse
description: Bring Kafka topics into ClickHouse with the Kafka engine or an external ingestion service
icon: kafka-in
order: 3
intro: |-
  Kafka ingestion into ClickHouse has several viable designs, each with
  different trade-offs. Choosing one means making a few design choices:

  - **Delivery semantics.** At-least-once by default; exactly-once needs extra machinery.
  - **Partition mapping.** How topic partitions map onto consumers and shards.
  - **Offset ownership.** Which component holds the committed offsets, and so what is re-read after a restart.
  - **Data transformation.** Where records are parsed, filtered, or reshaped before they are written to the target table.

  ClickHouse ingests a Kafka topic in one of two ways:

  - ClickHouse is the consumer, through the **Kafka table engine**. This catalog calls it **pull mode**.
  - An **external Kafka consumer** reads the topic and writes batches to ClickHouse. This catalog calls it **push mode**.

  The choice largely determines the offset owner and partition mapping.
  ClickHouse's
  [Kafka integrations guide](https://clickhouse.com/docs/integrations/connectors/data-ingestion/kafka/index)
  covers both.

  The **Kafka table engine** runs inside ClickHouse and owns its consumer groups
  and offset handling. In a sharded deployment it cannot assign a topic partition
  to a particular shard, and the sharded patterns work through the established
  ways around that:

  - every shard consumes the whole topic and keeps only the partitions it owns
  - every shard stores the whole topic, with duplicates removed by the query at read time
  - one node consumes the whole topic and inserts into a Distributed table, which routes each row to its shard

  **StorageKafka2**, an experimental addition with the `kafka_partition_shard_num`
  and `kafka_shard_count` settings, gives each shard a fixed slice of the
  partitions natively.

  An **external Kafka consumer** is a separate service to deploy and operate, and
  it owns the consumer groups and the offsets. Many tools fill this role,
  commercial and open source, differing in batching, delivery guarantees,
  in-pipeline transformation, and schema-change handling. The **ClickHouse Kafka
  Connect Sink** is the one used in these patterns, and the choice for production
  warrants a comparison.

  Where the Kafka consumers run and where rows are inserted depends on the
  ClickHouse topology: a single node, a ReplicatedMergeTree table that Keeper
  keeps in sync, or several shards that have to agree on which partition each of
  them owns. The patterns below combine pull or push consumption with each of
  these topologies.

