title: Kafka → ClickHouse
description: Bring Kafka topics into ClickHouse with the Kafka engine or an external consumer
icon: kafka-in
order: 3
intro: |-
  Kafka ingestion into ClickHouse has several viable designs, each with
  different trade-offs. Choosing one means making a few design choices:

  - **Delivery semantics.** At-least-once by default; exactly-once needs extra machinery.
  - **Partition mapping.** How topic partitions map onto consumers and shards.
  - **Offset ownership.** Which component holds the committed offsets, and so what is re-read after a restart.
  - **Data transformation.** Where records are parsed, filtered, or reshaped before they are written to the target table.

  Kafka records reach ClickHouse in one of two ways. ClickHouse can consume the
  topic itself with the Kafka table engine. Or an external Kafka consumer can
  consume the topic and write batches to ClickHouse, typically through the
  official ClickHouse Kafka Connect Sink. This choice largely determines the
  offset owner and partition mapping.
  ClickHouse's
  [Kafka integrations guide](https://clickhouse.com/docs/integrations/connectors/data-ingestion/kafka/index)
  covers both.

  With the **Kafka table engine**, ClickHouse itself is the consumer: no extra
  service is needed, but the engine owns consumer groups and offset handling.
  In a sharded deployment, the Kafka table engine cannot
  assign a topic partition to a particular shard. The sharded patterns work through the
  three established ways around that: read every partition and filter down to
  the ones a shard owns, store everything everywhere and deduplicate on read,
  or route the whole topic through a single consumer. A recent experimental
  addition, StorageKafka2 with the `kafka_partition_shard_num` and
  `kafka_shard_count` settings, gives each shard a fixed slice of the partitions
  natively, and one pattern demonstrates it.

  **An external consumer** runs outside ClickHouse. It is one more component to
  operate. In these examples, the ClickHouse Kafka Connect Sink owns delivery,
  including a KeeperMap-backed exactly-once mode that holds across replays.

  This catalog calls ClickHouse consuming from Kafka **pull**, and an external
  consumer writing into ClickHouse **push**.

  Where the consumers run and where rows land is then decided by the target
  layout, which may be a single node, a replicated table that Keeper keeps in
  sync across two nodes, or several shards that have to agree on which partition
  each of them owns. The following patterns show both approaches with each
  layout, so the consumer and table arrangement can be seen in every combination.

