manifest_version: 2
metadata:
  title: CDC · Postgres physical WAL → walshadow → ClickHouse
  description: |-
    [walshadow](https://github.com/ClickHouse/walshadow) replicates **Postgres** tables into ClickHouse by streaming physical WAL records from the source **Postgres** server and decoding them into ClickHouse rows.

    CDC tools such as PeerDB and Debezium use **logical decoding**: the source **Postgres** server decodes WAL into row changes (INSERT, UPDATE, DELETE) and streams those changes to the client. By contrast, **walshadow** receives physical WAL records from the source **Postgres** server and decodes them into row changes. The decoder reads table definitions from a **shadow Postgres** instance in the `walshadow` container. The shadow replays the source's catalog changes and provides the schema in effect when each record was written.

    Compared with logical decoding:

    - Both slot types make the source **Postgres** server retain WAL until the client confirms it. A logical slot also holds `catalog_xmin`, which prevents VACUUM from removing old system-catalog rows that decoding may still read; a physical slot does not.
    - Logical decoding runs on the source **Postgres** server; **walshadow** decodes WAL outside the source **Postgres** server.
    - Logical decoding does not replicate DDL commands ([restrictions](https://www.postgresql.org/docs/16/logical-replication-restrictions.html)). **walshadow** reads schema changes from the WAL and applies the supported ones to the ClickHouse table in WAL order ([schema changes](https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/docs/schema-changes.md)).

    ### Demo setup

    **walshadow** copies `public.orders` into `walshadow.public_orders`, ordered by the source primary key `id`. The demo then replicates inserts, updates, deletes and schema changes. Click `walshadow.public_orders` in the diagram to open its table details. The **Data** section shows a row sample that can include earlier versions and delete markers.

    ### Following a row through the pipeline

    In **Data**, `replication_latency_ms` measures the time from a row write in Postgres to its insert in ClickHouse. Initial-load and delete rows show `NULL`.

    Reducing `[ch] flush_timeout_ms` in `config/latency.toml` (default: 1,000 ms) flushes smaller batches sooner: latency drops, and ClickHouse receives more INSERTs and creates more parts.

    Edit the files in `config/`, then run `just reload` to rebuild the demo with the new settings. The **Configuration** panel displays the files.

    The **Experiments** panel runs a timed insert workload with chosen values for the `config/` latency settings and records the latency per stage and the new parts per run.

    ### Delivery guarantees

    From **walshadow**'s [ordering and consistency](https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/docs/limitations.md) and [destination tables](https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/docs/destination-tables.md) documentation:

    - Delivery is at-least-once; `ReplacingMergeTree(_lsn, _is_deleted)` removes rows resent after a restart at merge or `FINAL`.
    - Rows from one **Postgres** transaction in different tables become visible in ClickHouse at different moments.
    - **walshadow** confirms WAL to the source **Postgres** server only after ClickHouse acknowledges every earlier insert.
    - When required WAL is missing, **walshadow** stops with an error at its last persisted position.

    ### Operational constraints

    - **walshadow** parses the physical WAL format and the heap tuple layout, and both can change in any **Postgres** major version. The daemon runs only on major versions that **walshadow** has audited, and the **walshadow** image must match the source **Postgres** server's major version ([limitations](https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/docs/limitations.md)).
    - Failover, major-version upgrades and some schema changes on the source **Postgres** server interrupt **walshadow**'s replication; it resumes after the steps described in the [failover](https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/docs/failover.md) and [limitations](https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/docs/limitations.md) pages.
    - Physical replication connections are available on self-managed **Postgres** and on ClickHouse Managed Postgres. Managed services such as [RDS](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PostgreSQL.Replication.ReadReplicas.Configuration.html) document physical replication for their own read replicas and logical replication for external consumers; the [walshadow launch post](https://clickhouse.com/blog/introducing-walshadow) states that most managed **Postgres** services keep physical WAL internal.
    - Each replicated table needs a primary key, `REPLICA IDENTITY USING INDEX` or `REPLICA IDENTITY FULL`. The destination `ORDER BY` uses that row key ([destination tables](https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/docs/destination-tables.md)).
    - The source **Postgres** server needs a `pg_hba` rule for replication connections and `max_wal_senders` of at least 2: one WAL sender streams WAL while another serves the base backup ([getting started](https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/docs/getting-started.md)).
    - **Postgres** removes or recycles WAL files once a checkpoint has written their changes to the data files and every replication slot and the WAL archiver have moved past them; replication stops if **walshadow** still needed them ([configuration](https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/docs/configuration.md)).
    - **walshadow** stores its WAL position (LSN) and its shadow **Postgres** in a local directory, which must survive restarts; losing it forces a full initial load ([operations](https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/docs/operations.md)).

    ### walshadow internals

    **walshadow** streams physical WAL from the source **Postgres** server to a **shadow Postgres** in its container, which replays only the catalog changes, and decodes each row change with the table definition the shadow holds at that record's LSN.

    #### WAL level

    The source **Postgres** server runs with `wal_level = logical`, the same setting logical decoding requires. At this level, WAL records contain the row data **walshadow** decodes:

    - the complete new tuple of each INSERT and UPDATE; an out-of-line (TOAST) value left unchanged by an UPDATE is logged only as a pointer, which **walshadow** resolves from its own copy of the TOAST data ([TOAST and type conversion](https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/architecture/values.md))
    - the old replica identity columns of each DELETE, and of each UPDATE that changes them

    At the default `wal_level = replica`, an UPDATE record can contain only the changed bytes of the new tuple, and a DELETE record contains only the tuple's location.

    #### Physical replication and logical decoding

    A client reads this WAL through physical replication (WAL records as written to the WAL files) or logical decoding (rows decoded by **Postgres**). Both use the streaming replication protocol, and the replication command the client sends selects the mode:

    - PeerDB and Debezium send `START_REPLICATION SLOT <slot> LOGICAL`. The server runs logical decoding and sends row changes.
    - **walshadow** sends `START_REPLICATION PHYSICAL`. The server sends the WAL records as written.

    #### Decoding a WAL record

    Postgres writes each row change to the WAL as a heap record, in the row's on-disk form. The record identifies the table only by its relfilenode, a storage file number, and contains the row as a heap tuple: a sequence of bytes without column names or types. To decode the tuple into a row, **walshadow** needs the table definition from the catalog (name, columns and their types) as it was at the record's LSN, because a later `ALTER TABLE` can change it.

    :::fold Example: decoding the INSERT of one `public.orders` row

    The 91-byte WAL record of `INSERT ... (5, 'erin', 500)` from a run of this pattern, at LSN `0/03014CC0`. `pg_waldump -r Heap` in the `postgres` container lists the records; the bytes are at the LSN's offset in the WAL segment file.

    ```
    offset  bytes                    field
    00      5b 00 00 00              record length: 91
    04      ea 02 00 00              transaction id 746
    08      90 4c 01 03 00 00 00 00  previous record: LSN 0/03014C90
    16      00 0a 00 00              INSERT, resource manager 10 (Heap)
    20      f9 81 70 34              CRC
    24      00 20 2a 00              block reference 0, 42 bytes of block data
    28      7f 06 00 00              tablespace 1663
    32      00 40 00 00              database 16384
    36      13 40 00 00              relfilenode 16403      <- the table
    40      00 00 00 00              block number 0
    44      ff 03                    main data: 3 bytes
    46      06 00 02 08 18           tuple header: 6 columns, variable-width values, data at byte 24
    51      00                       padding
    52      05 00 00 00              5                      <- id: integer, 4 bytes, least significant byte first
    56      0b 65 72 69 6e           'erin'                 <- customer: varchar, length byte 0b (4 characters follow), then e r i n
    61      00 00 00                 padding to a 4-byte boundary
    64      f4 01 00 00              500                    <- amount: integer, 4 bytes
    68      9e 7b 6a 9b 34 02 03 00  2026-11-01 12:04:59.133854 UTC  <- created_at: timestamptz, 8 bytes, microseconds since 2000-01-01
    76      9e 7b 6a 9b 34 02 03 00  same value             <- updated_at: timestamptz, 8 bytes
    84      09 6e 65 77              'new'                  <- status: text, length byte 09 (3 characters follow), then n e w
    88      07 00 08                 main data: offset number 7, flags 08 (contains new tuple)
    ```

    The table appears only as relfilenode 16403 (bytes 36-39). The short `varchar` and `text` values in this record start with a one-byte length header; longer, compressed or out-of-line values use other headers ([variable-length storage](https://www.postgresql.org/docs/16/storage-toast.html)). Bytes 52-87 are the column values without names or types: splitting them into `id`, `customer`, `amount` and the rest requires the table definition.

    :::

    **walshadow** runs a **shadow Postgres** in its container and streams WAL to it with user-table records replaced by no-ops. The shadow replays catalog changes and by default stores only catalog data. **walshadow** reads table descriptors from the shadow at the replay LSN, decodes rows from the original WAL records, and inserts them into ClickHouse over the Native protocol.

    #### Initial load

    **walshadow** creates a **shadow Postgres** instance and loads existing table rows in separate steps:

    - On first start, **walshadow** streams a base backup of the source **Postgres** server and writes only its catalog and recovery files to the **shadow Postgres** data directory.
    - Existing rows are loaded per table, as set by `initial_load`. `copy` reads the visible rows with `COPY` after the table is selected; COPY rows get the selection LSN as `_lsn`, and WAL changes committed later carry a higher `_lsn` and replace them. `base_backup` reads heap pages from a new base backup of the whole cluster; `object_store` reads them from the latest wal-g backup plus archived WAL ([table selection](https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/docs/table-selection.md)).
    - Changes committed after the load LSN are inserted from WAL with a higher `_lsn` ([initial loads](https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/architecture/bootstrap.md)).

    In this pattern, `walshadow-stream init --table public orders` sets `initial_load = "copy"` for `public.orders`.

    #### ClickHouse destination table

    The destination engine is `ReplacingMergeTree(_lsn, _is_deleted)`. `FINAL` returns the row with the highest `_lsn` per sorting key and excludes rows with `_is_deleted = true`.

    #### Postgres version

    The shadow starts from a physical base backup and replays source WAL, so it runs the source **Postgres** major version. The pattern builds the **walshadow** image from upstream commit `97f9305` for **Postgres** 16. The **walshadow** repository is licensed AGPL-3.0.
  graph: |-
    snapshot:
      postgres:orders(label=public.orders,note=**Source Postgres server** · service `postgres`\n- wal_level = logical\n- pg_hba allows replication connections\n- public.orders_existing also replicates: replicate_all = true)
        -[base backup]-> connector:shadow_pg(label=shadow Postgres,system=walshadow,note=**Separate Postgres server** · walshadow container\nRestored from the base backup. Its walreceiver receives the filtered WAL and its startup process replays it.\n- stores only catalog data by default)

    snapshot:
      postgres:orders
        -[COPY]-> connector:copy_load(label=initial load,system=walshadow,note=**walshadow-stream process**\nReads the visible rows of public.orders with COPY at a selected LSN.\n- initial_load = "copy")
        -[INITIAL LOAD · Native INSERT]-> mergetree:public_orders(label=walshadow.public_orders,note=**walshadow-created table**\nReplacingMergeTree(_lsn, _is_deleted), ORDER BY the source primary key.\n- _lsn: commit LSN, row version\n- _is_deleted: delete marker\n- _xid and _commit_ts)

    changes:
      postgres:orders
        -[physical WAL · streaming replication]-> connector:wal_stream(label=WAL stream · filter,system=walshadow,note=**walshadow-stream process**\nPasses original WAL records to the decoder and sends the shadow a copy with user-table records replaced by no-ops.)
        -[original WAL records]-> connector:decoder(label=row decoder · inserters,system=walshadow,note=**walshadow-stream process**\nDecodes rows from original WAL records with table definitions read from the shadow.\n- inserts Native protocol blocks)
        -[row versions · Native INSERT]-> mergetree:public_orders

    catalog:
      connector:wal_stream
        -[filtered WAL · streaming replication]-> connector:shadow_pg
        -[catalog reads at replay LSN]-> connector:decoder

    query:
      mergetree:public_orders
        -[FINAL]-> client:readers(label=query clients)
  status: wip
  experimental: true
  topology: single
  order: 6
  tags: [cdc, postgres, walshadow, physical-wal]
  references:
    - label: walshadow default insert flush timeout
      url: https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/src/emit/ch_emitter.rs#L80
    - label: Introducing walshadow (ClickHouse blog)
      url: https://clickhouse.com/blog/introducing-walshadow
    - label: walshadow repository
      url: https://github.com/ClickHouse/walshadow
    - label: walshadow quickstart
      url: https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/docs/quickstart.md
    - label: walshadow architecture
      url: https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/architecture/README.md
    - label: walshadow destination tables
      url: https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/docs/destination-tables.md
    - label: walshadow current limitations
      url: https://github.com/ClickHouse/walshadow/blob/97f9305316eb5ff89cb3e0071eff095722db4143/docs/limitations.md
    - label: WalShadow in ClickHouse Cloud
      url: https://clickhouse.com/cloud/postgres/walshadow

  tradeoffs:
    benefits:
      - Uses a physical replication connection, with an optional physical slot.
      - Runs as one container beside ClickHouse and the source Postgres server.
      - Inserts Native protocol blocks into ClickHouse directly.
      - Applies ADD COLUMN DEFAULT, RENAME COLUMN, DROP COLUMN and CREATE TABLE in WAL order.
    limitations:
      - "Tied to Postgres internals: one image per Postgres major version, audited versions only."
      - Requires physical replication access to the source Postgres server.
      - Reliability depends on configured WAL retention and on walshadow's local state.
      - ClickHouse rejects dropping or renaming sorting-key columns; the rejection stops replication.
      - "Eventually consistent: at-least-once delivery, no cross-table transaction atomicity, `FINAL` for current state."
      - Development preview.

spec:
  profiles: [single, postgres, walshadow]
  driver_node: ch
  services:
    walshadow:
      config:
        - file: config/latency.toml
          target: /etc/walshadow/ch-config.d/10-pattern.toml
    postgres:
      init: source-init.sql

  experiments:
    - name: replication-latency
      title: Replication latency
      description: Inserts orders into Postgres at a fixed rate and measures the time from the Postgres write to the ClickHouse insert.
      script: experiments/replication_latency.py
      parameters:
        - name: flush_timeout_ms
          label: walshadow flush timeout (ms)
          short: flush ms
          group: walshadow
          default: 1000
          min: 1
          config: {file: config/latency.toml, key: flush_timeout_ms}
        - name: rate
          label: Rows per second
          short: requested/s
          group: Postgres
          default: 50
          min: 1
        - name: rows_per_txn
          label: Rows per transaction
          short: rows/txn
          group: Postgres
          default: 1
          min: 1
        - name: duration
          label: Duration (s)
          short: secs
          group: Postgres
          default: 10
          min: 1
      results:
        - name: rows
          label: rows
          group: Postgres
          description: Rows inserted into Postgres during the run.
        - name: achieved_rate
          label: actual/s
          group: Postgres
          description: Rows per second actually written to Postgres; below the requested rate when one connection cannot insert that fast.
        - name: p50_ms
          label: p50
          group: End to end (ms)
          description: Median time from the Postgres write to the ClickHouse insert, per row.
        - name: p95_ms
          label: p95
          group: End to end (ms)
          description: 95th percentile of the same per-row time.
        - name: p99_ms
          label: p99
          group: End to end (ms)
          description: 99th percentile of the same per-row time.
        - name: max_ms
          label: max
          group: End to end (ms)
          description: Slowest row.
        - name: parts
          label: parts
          group: ClickHouse
          description: New data parts in walshadow.public_orders during the run (system.part_log).
        - name: async_buffer_avg_ms
          label: buffer avg
          group: ClickHouse
          description: Average time in ms an INSERT's data waited in ClickHouse's async insert buffer until the flush (system.asynchronous_insert_log). Empty when the INSERTs are synchronous.
        - name: async_buffer_max_ms
          label: buffer max
          group: ClickHouse
          description: Longest async insert buffer wait, in ms.
        - name: part_write_avg_ms
          label: write avg
          group: ClickHouse
          description: Average time in ms ClickHouse took to write one new part (system.part_log duration_ms).
        - name: part_write_max_ms
          label: write max
          group: ClickHouse
          description: Slowest part write, in ms.
      groups: [Postgres, walshadow, ClickHouse, End to end (ms)]
      timeline_total: Average row latency (write to insert)

  steps:
    # walshadow `init` runs at container start and creates the walshadow
    # database and public_orders; load.py applies changes on the source Postgres server.
    schema: schema.sql
    load: load.py

    ready_when:
      - query: SELECT engine FROM system.tables WHERE database = 'walshadow' AND name = 'public_orders'
        value: ReplacingMergeTree
        node: ch
        timeout: 120
      - query: SELECT count() FROM walshadow.public_orders FINAL
        value: 5
        node: ch
        timeout: 120
      - query: SELECT count() FROM walshadow.public_orders FINAL WHERE id = 4 AND status = 'shipped'
        value: 1
        node: ch
        timeout: 120
      - query: SELECT count() FROM walshadow.public_orders FINAL WHERE id IN (2, 4, 5, 6) AND updated_at != _commit_ts AND replication_latency_ms = dateDiff('microsecond', updated_at, ch_inserted_at) / 1000.0
        value: 4
        node: ch
        timeout: 120
      - query: SELECT count() FROM walshadow.public_orders FINAL WHERE id = 1 AND replication_stage = 'Initial load' AND ch_inserted_at IS NULL AND replication_latency_ms IS NULL
        value: 1
        node: ch
        timeout: 120
      - query: SELECT count() FROM walshadow.public_orders FINAL WHERE replication_stage = 'CDC change'
        value: 4
        node: ch
        timeout: 120
      - query: SELECT count() FROM walshadow.public_orders FINAL WHERE created_at > toDateTime64('2000-01-01 00:00:00', 6, 'UTC')
        value: 5
        node: ch
        timeout: 120
      - query: SELECT count() FROM walshadow.public_orders FINAL WHERE id IN (2, 4, 5, 6) AND updated_at > created_at
        value: 4
        node: ch
        timeout: 120

      - query: SELECT count() FROM walshadow.public_orders WHERE _is_deleted != 0 AND replication_latency_ms IS NOT NULL
        value: 0
        node: ch
        timeout: 180

    verify:
      sql: verify.sql
      expected: expected.txt
