tradeoffs:
  benefits:
    - A full replace leaves no earlier version of a row to reconcile, so the target is a plain MergeTree read without FINAL, without a version column, and without a tombstone predicate.
    - The rows are stored locally, so compression, the primary index, skip indexes, and projections all apply, and joins against local tables no longer touch Postgres.
    - Exactly one reader hits Postgres per interval regardless of how many analysts query the copy, which is the read-load problem the pass-through pattern has.
    - The entire mechanism is one DDL statement; the schedule and its run history live in ClickHouse (`system.view_refreshes`), so there is no connector process or pipeline state to operate.
    - A failed refresh leaves the previous result in place and the next scheduled run retries, so a transient Postgres outage degrades to staleness rather than to a broken table.
  drawbacks:
    - The copy is stale by up to the refresh interval, so this cannot serve a use case that needs to see a write seconds after it commits.
    - Every refresh re-reads every row, so cost grows with table size rather than with change volume; this is the wrong shape for a large or fast-churning table.
    - Each refresh is a full scan on the Postgres side too, which is a periodic load spike on the OLTP database rather than the continuous trickle a WAL reader produces.
    - Only the current state is captured; intermediate values between two refreshes are never observed, so this cannot feed an audit trail or a change-history table.
    - Refreshes are wall-clock scheduled and independent per view, so several large views on the same interval can pile onto the same minute unless staggered with `OFFSET` or chained with `DEPENDS ON`.
    - The APPEND variant rewrites the whole table on every tick whether or not anything changed, so its storage grows as rows times refreshes and needs both a coarse interval and a TTL.

schema_sql: schema.sql
load: load.py

# schema.sql's CREATE triggers an immediate first refresh; load.py then mutates
# Postgres and returns. These checks wait out the next scheduled refresh and
# assert the full replace applied all three changes: the insert, the update,
# and - with no tombstone anywhere - the delete.
ready_when:
  - query: "SELECT count() FROM test.orders"
    value: 3
    node: ch
    timeout: 60
  - query: "SELECT count() FROM test.orders WHERE id = 4"
    value: 1
    node: ch
    timeout: 60
  - query: "SELECT toInt32(amount) FROM test.orders WHERE id = 2"
    value: 250
    node: ch
    timeout: 60
  - query: "SELECT count() FROM test.orders WHERE id = 3"
    value: 0
    node: ch
    timeout: 60
  # The append-only variant: the newest snapshot has dropped the deleted row,
  # while the history still holds it from an earlier snapshot.
  - query: "SELECT count() FROM test.orders_latest"
    value: 3
    node: ch
    timeout: 60
  - query: "SELECT count() FROM test.orders_latest WHERE id = 3"
    value: 0
    node: ch
    timeout: 60
  - query: "SELECT count() > 0 FROM test.orders_history WHERE id = 3"
    value: 1
    node: ch
    timeout: 60
  - query: "SELECT uniqExact(snapshot_at) > 1 FROM test.orders_history"
    value: 1
    node: ch
    timeout: 60

verify:
  sql: verify.sql
  expected: expected.txt
