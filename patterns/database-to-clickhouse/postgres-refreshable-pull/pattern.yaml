manifest_version: 1
title: "Refreshable MV pull from Postgres (scheduled full replace)"
description: |-
  A refreshable materialized view reruns a full `SELECT` against Postgres on a fixed schedule and atomically replaces a local MergeTree with the result.

  Because `APPEND` is not used, each refresh replaces the table in full. A row deleted in Postgres is simply absent from the next result, so the target never holds two versions of a row to reconcile. Readers query a plain MergeTree without `FINAL`, trailing the source by at most one interval.

  The approach suits any table small enough to re-read in full, such as dimensions, configuration, and lookups. Cost scales with table size rather than change volume, so a large or fast-changing source belongs on CDC instead.

  A second view keeps the history. An OLTP source overwrites rows in place, and a full replace discards the previous result on each refresh, so an earlier value cannot be recovered from either side. Reproducing last week's report or auditing a figure that moved overnight both require that record.

  `REFRESH EVERY 5 SECOND APPEND` appends each refresh instead of replacing it, stamped with the time it was observed. Current state is the newest snapshot, and earlier snapshots stay queryable.

  This simple history example grows indefinitely. A real deployment needs a retention policy, such as a TTL on `snapshot_at`, aligned with the required history.
graph: |-
  refresh:
    postgres:orders(label=public.orders,note=**Live OLTP source**\nThe application writes here directly; ClickHouse only reads, once per refresh.\n- must stay small enough to re-read whole\n- changes appear at the next refresh)
      -[full SELECT · once per refresh]-> remote-table:pg_orders@table-engine(label=test.pg_orders,note=**Postgres Table Engine**\nA declaration, not a copy.\n- read once per refresh, by the view alone)
      -[REFRESH EVERY 5 SECOND]-> refreshable-mv:orders(label=test.orders,engine=MergeTree,note=**Atomic full replace**\n- reruns the whole SELECT\n- swaps the finished result in\n- a deleted row is absent from the next result)

  history:
    remote-table:pg_orders@table-engine
      -[REFRESH EVERY 5 SECOND APPEND]-> refreshable-mv:orders_history(label=test.orders_history,engine=MergeTree,note=**Periodic snapshot**\nEach refresh is appended rather than replacing.\n- one snapshot_at per refresh\n- nothing is ever discarded\n- grows as rows x refreshes)

  history:
    refreshable-mv:orders_history
      -[newest snapshot only]-> mv:orders_latest(label=test.orders_latest,note=**Current state from history**\nSelects the whole newest snapshot.\n- a deleted row is absent from it\n- per-key argMax would keep it)

  query:
    {refreshable-mv:orders, mv:orders_latest}
      -[plain SELECT · no FINAL]-> client:readers(label=analytics readers,note=**Plain reads**\nA plain MergeTree read.\n- stale by up to one interval)
category: ingestion
flow: ingestion
topology: single
order: 2
tags: [postgres, refreshable-mv, scheduled-pull, dimension-table]
