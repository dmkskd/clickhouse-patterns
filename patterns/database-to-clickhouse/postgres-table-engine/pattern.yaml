manifest_version: 1
status: stable
title: "Postgres table engine (query in place, no copy)"
description: |-
  ClickHouse queries Postgres tables directly, without keeping a copy.

  ClickHouse offers three ways to do this:

  - **[Postgres Table Engine](https://clickhouse.com/docs/engines/table-engines/integrations/postgresql):** binds one locally declared ClickHouse table to one Postgres table, with the column types chosen at declaration time.
  - **[Postgres Database Engine](https://clickhouse.com/docs/engines/database-engines/postgresql):** maps an entire schema in a single statement and requires no per-table DDL. Its tables and types are discovered when queried, so a table added in Postgres becomes queryable without any change in ClickHouse.
  - **[postgresql() table function](https://clickhouse.com/docs/sql-reference/table-functions/postgresql):** carries the connection inline and creates no ClickHouse object.

  In all three cases, every read in ClickHouse issues a query to the Postgres server, and as Postgres executes that query, results always reflect the current state of the source table.
graph: |-
  query:
    postgres:orders(label=public.orders,note=**Live OLTP source**\nThe application writes here directly; ClickHouse only reads it.\n- every read sees the current state\n- no stale rows on a change)
      -[rows returned per SELECT]-> remote-table:orders_table_engine@table-engine(label=test.orders_table_engine,note=**Postgres Table Engine**\nA declaration bound to one table. Holds no local data and is resolved on every read.)
      -> client:analyst(label=ClickHouse client)

  query:
    postgres:orders
      -[rows returned per SELECT]-> remote-table:pg_schema@database-engine(label=pg_schema.orders,note=**Postgres Database Engine**\n- tables discovered at query time\n- new Postgres tables need no ClickHouse DDL)
      -> client:analyst

  query:
    postgres:orders
      -[rows returned per SELECT]-> remote-table:postgresql_fn@table-function(label=postgresql(...),note=**Postgres table function**\nThe connection lives in the query text.\n- creates no object\n- suits one-off reads and INSERT ... SELECT)
      -> client:analyst
category: federation
flow: query
topology: single
order: 1
tags: [postgres, federation, table-engine, no-copy]
profiles: [single, postgres]
driver_node: ch

references:
  - label: "ClickHouse: MySQL table engine (the same shape, MySQL source)"
    url: https://clickhouse.com/docs/engines/table-engines/integrations/mysql

tradeoffs:
  benefits:
    - Setup is limited to ClickHouse DDL, with no connector to run and no replication state to preserve.
    - Reads are always current, so there is no staleness window, no snapshot to bootstrap, and no reconciliation after a source correction.
    - Deletes and updates in Postgres appear on the next read, without a ReplacingMergeTree, a version column, or FINAL, because ClickHouse stores no history to collapse.
    - The database engine exposes the whole Postgres schema, so a new source table becomes queryable with no ClickHouse DDL.
  limitations:
    - Every ClickHouse query against these tables is executed by the Postgres server, adding to its load.
    - As the query is executed by the Postgres server, ClickHouse's columnar optimizations (compression, primary index, skip indexes, projections) do not apply.
    - Every query is issued to the Postgres server, so it carries round-trip latency and data transfer costs.
    - Query completion depends on the availability of the Postgres server, a system outside ClickHouse's control.
    - Postgres and ClickHouse have different type systems, so a Postgres column type does not always have an exact ClickHouse equivalent.
    - No connection to Postgres is opened when the table is created, so a wrong host, a missing table, or an unusable column type is only reported on the first read.

schema_sql: schema.sql
load: load.py

# The mutations in load.py need no convergence wait: with no local copy, the
# next read is already correct. These checks assert exactly that property.
ready_when:
  - query: "SELECT count() FROM test.orders_table_engine"
    value: 3
    node: ch
    timeout: 30
  - query: "SELECT amount FROM test.orders_table_engine WHERE id = 2"
    value: 250
    node: ch
    timeout: 30
  - query: "SELECT count() FROM pg_schema.orders WHERE id = 3"
    value: 0
    node: ch
    timeout: 30

verify:
  sql: verify.sql
  expected: expected.txt
