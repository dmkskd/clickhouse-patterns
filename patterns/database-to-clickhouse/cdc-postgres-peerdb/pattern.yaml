manifest_version: 1
status: under-review
title: "CDC · Postgres WAL → PeerDB → ClickHouse"
description: |-
  Self-hosted PeerDB, the open-source engine behind managed Postgres ClickPipes, replicating two Postgres tables into three ClickHouse targets. One is created by PeerDB, one is owned by the schema, and one is transformed by a materialized view.

  Snapshot and change batches are staged as Avro objects in MinIO. PeerDB then issues `INSERT ... SELECT FROM s3()` statements, and ClickHouse pulls the named objects when they run. Ongoing changes land first in `_peerdb_raw_two_table_mirror` and are decoded into the targets from there.

  PeerDB performs no in-flight transformation. It has no per-message transform hook on the CDC path, so all shaping happens in ClickHouse, either in the target DDL or in a materialized view.

  **Two Postgres instances run in this pattern, with unrelated responsibilities.** `postgres` is the replication source holding the user data. `peerdb-catalog` stores PeerDB's own metadata and Temporal's workflow history, and never holds a replicated row.

  Beyond ClickHouse and the source database, the stack adds nine services, because replication runs as Temporal workflows. Nothing at this three-row scale exercises what that provides.
