manifest_version: 2
metadata:
  title: CDC · Postgres WAL → PeerDB → ClickHouse
  description: |-
    PeerDB replicates Postgres tables into ClickHouse through a logical replication slot. PeerDB is the open-source replication engine used by Postgres ClickPipes.

    PeerDB can create the ClickHouse destination table automatically or replicate into an existing table. PeerDB creates `test.orders` automatically; `schema.sql` creates `test.orders_existing` before replication starts.

    Snapshot and change batches are staged as Avro objects in S3-compatible object storage (MinIO in this stack). PeerDB then issues `INSERT ... SELECT FROM s3()` statements, and ClickHouse reads the staged objects from the object store. Ongoing changes are inserted first into `_peerdb_raw_two_table_mirror`, then decoded from that table into their respective destination tables.

    PeerDB replicates source values unchanged. ClickHouse applies transformations through target-table expressions and materialized views.

    **Two Postgres instances run in this pattern.** `postgres` is the source database being replicated. `peerdb-catalog` stores PeerDB's own metadata and Temporal's workflow history.

    PeerDB runs replication as Temporal workflows, so the stack needs several services beyond ClickHouse and the source database.

    ### Following a row through the pipeline

    `replication_latency_ms` measures source row write → ClickHouse insert in milliseconds, using `updated_at` and `ch_inserted_at`. Snapshot and delete rows show `NULL`.

    Lower latency: reduce `sync_interval` in `config/mirror.sql` (seconds; default: 10); this demo already sets 1 second, at the cost of more frequent MinIO and ClickHouse loads.

    Edit the files in `config/`, then run `just reload` to rebuild the demo with the new settings. The **Configuration** panel displays the files.

    Inspect `test.orders` and `test.orders_existing` in **Contents**: source write times sit alongside `_peerdb_synced_at` (PeerDB metadata) and `ch_inserted_at` (destination execution). The raw mirror table and MinIO objects expose the intermediate CDC batch. `_peerdb_synced_at` is kept separate from the source write time and is not treated as a Postgres commit timestamp. The materialized view copies `ch_inserted_at` and `replication_latency_ms` unchanged, so `test.orders_transformed` reports the arrival time in `test.orders`.

    The **Experiments** panel runs a timed insert workload with chosen values for the `config/` latency settings and records latency, parts and INSERT cost per run.
  graph: |-
    snapshot:
      postgres:source_tables(label=public.orders + public.orders_existing,note=**Source Postgres** · service `postgres`\nThe replicated user data.\n- not the peerdb-catalog\n- read through a logical replication slot)
        -[initial copy]-> peerdb:snapshot_worker(mirror=two_table_mirror)
        -[writes Avro]-> minio:snapshot_files(bucket=clickhouse,prefix=peerdb/,format=Avro,label=snapshot Avro,note=**Transient stage** · `s3://clickhouse/peerdb/two_table_mirror/`\nDeleted once ClickHouse has read the objects.\n- the mirror's single staging path, shared with the CDC batches)
        -[SNAPSHOT · INSERT INTO orders FROM s3()]-> mergetree:orders(label=test.orders · PeerDB-owned schema)

    snapshot:
      minio:snapshot_files
        -[SNAPSHOT · INSERT INTO orders_existing FROM s3()]-> mergetree:orders_existing(label=test.orders_existing · user-owned schema)

    changes:
      postgres:source_tables
        -[logical WAL]-> peerdb:cdc_worker(mirror=two_table_mirror,checkpoint=metadata_last_sync_state)
        -[writes Avro]-> minio:cdc_batch(bucket=clickhouse,prefix=peerdb/,format=Avro,label=CDC batch Avro,note=**Transient stage** · `s3://clickhouse/peerdb/two_table_mirror/`\nDeleted once ClickHouse has read the objects.\n- same staging path as the snapshot objects)
        -[INSERT INTO _peerdb_raw … FROM s3()]-> mergetree:_peerdb_raw_two_table_mirror@peerdb-internal(label=mirror-wide CDC staging,table=test._peerdb_raw_two_table_mirror,note=**PeerDB-internal table** · one per mirror\npeerdb-flow-worker issues INSERT … SELECT FROM s3() against test._peerdb_raw_two_table_mirror; ClickHouse reads the batch's Avro objects.\n- target inserts then decode each row into the table named by _peerdb_destination_table_name)

    changes:
      mergetree:_peerdb_raw_two_table_mirror@peerdb-internal
        -[PeerDB SQL · destination = orders]-> mergetree:orders

    changes:
      mergetree:_peerdb_raw_two_table_mirror@peerdb-internal
        -[PeerDB SQL · destination = orders_existing]-> mergetree:orders_existing

    transformation:
      mergetree:orders
        -> mv:orders_transform_mv(reads=orders only)
        -> mergetree:orders_transformed@mv-transformed(source=orders MV)
  status: under-review
  topology: single
  order: 4
  tags: [cdc, postgres, peerdb, clickpipes]
  references:
    - label: PeerDB default CDC batch interval (v0.37.0)
      url: https://github.com/PeerDB-io/peerdb/blob/v0.37.0/flow/activities/flowable.go#L63
    - label: PeerDB self-hosted quickstart
      url: https://docs.peerdb.io/quickstart/quickstart
    - label: PeerDB ClickHouse data modeling
      url: https://docs.peerdb.io/bestpractices/clickhouse_datamodeling
    - label: ClickHouse open-source Postgres and ClickHouse stack
      url: https://clickhouse.com/blog/postgres-clickhouse-oss
    - label: ClickPipes for Postgres and self-hosted PeerDB
      url: https://clickhouse.com/blog/clickpipes-postgres-failover-replication
    - label: 'Why PeerDB runs on Temporal: retries, idempotency, long-running state'
      url: https://blog.peerdb.io/using-temporal-to-scale-data-synchronization-at-peerdb
    - label: PeerDB components and replication workflows
      url: https://deepwiki.com/PeerDB-io/peerdb
    - label: PeerDB CDC Postgres to ClickHouse reference
      url: https://docs.peerdb.io/mirror/cdc-pg-clickhouse

  tradeoffs:
    benefits:
      - The initial load is split into row ranges along an ordered column such as an id or a timestamp, and the ranges are copied in parallel, so a failure only repeats the ranges that had not finished.
      - Once streaming, each batch is a recorded step, so a worker that dies resumes at the next unfinished batch instead of replaying from the last saved position in the WAL.
      - A step that fails retries on its own, with its own backoff, rather than stalling the pipeline until someone restarts it. This and the two points above all follow from running replication as Temporal workflows, whose durable execution model records each completed step.
      - Reading the WAL and writing to ClickHouse are separate steps joined by a staging table, so a slow ClickHouse merge does not back up into the Postgres replication slot.
      - Workers hold no state, so capacity is added by running more of them.
    limitations:
      - Nine services beyond ClickHouse and the source database, where the Altinity sink needs one.
      - PeerDB needs a store of its own. A second Postgres holds its mirror configuration and Temporal's workflow history, so there is another database to run, secure, and back up, entirely separate from the one being replicated.
      - No in-flight transformation, because PeerDB has no per-message transform hook on the CDC path, so records are inserted as produced and all shaping happens in ClickHouse.
      - Current-state reads need ReplacingMergeTree FINAL semantics and a tombstone filter.
      - A schema-owned target must keep PeerDB's metadata columns, and a transformation needs an explicit snapshot backfill.

spec:
  profiles: [single, postgres, s3, peerdb]
  driver_node: ch

  services:
    postgres:
      init: source-init.sql

  experiments:
    - name: replication-latency
      title: Replication latency
      description: Inserts orders into Postgres at a fixed rate and measures the time from the Postgres write to the ClickHouse insert.
      script: experiments/replication_latency.py
      parameters:
        - name: sync_interval
          label: PeerDB sync interval (s)
          default: 1
          config: {file: config/mirror.sql, key: sync_interval}
        - name: rate
          label: Rows per second
          default: 50
        - name: rows_per_txn
          label: Rows per transaction
          default: 1
        - name: duration
          label: Duration (s)
          default: 10
      results:
        - name: rows
          label: Rows
          description: Rows inserted into Postgres during the run.
        - name: achieved_rate
          label: Achieved rate (rows/s)
          description: Rows per second actually written to the source; below the target rate when one connection cannot insert that fast.
        - name: p50_ms
          label: p50 (ms)
          description: Median time from the Postgres write to the ClickHouse insert, per row.
        - name: p95_ms
          label: p95 (ms)
          description: 95th percentile of the same per-row time.
        - name: p99_ms
          label: p99 (ms)
          description: 99th percentile of the same per-row time.
        - name: max_ms
          label: Max (ms)
          description: Slowest row.
        - name: parts
          label: Parts
          description: New data parts in test.orders during the run (system.part_log).
        - name: inserts
          label: INSERTs
          description: INSERT statements ClickHouse executed into test.orders during the run (system.query_log).
        - name: insert_avg_ms
          label: INSERT avg (ms)
          description: Average ClickHouse execution time of those INSERT statements.
        - name: insert_max_ms
          label: INSERT max (ms)
          description: Slowest of those INSERT statements.

  steps:
    # schema.sql provides orders_existing; PeerDB creates orders. load.py installs
    # the transformation after the initial snapshot creates its source table.
    schema: schema.sql
    load: load.py

    ready_when:
      - query: SELECT engine FROM system.tables WHERE database = 'test' AND name = '_peerdb_raw_two_table_mirror'
        value: MergeTree
        node: ch
        timeout: 180
      - query: SELECT count() FROM test._peerdb_raw_two_table_mirror
        value: 18
        node: ch
        timeout: 180
      - query: SELECT engine FROM system.tables WHERE database = 'test' AND name = 'orders'
        value: ReplacingMergeTree
        node: ch
        timeout: 180
      - query: SELECT type FROM system.columns WHERE database = 'test' AND table = 'orders_existing' AND name = 'amount'
        value: Int64
        node: ch
        timeout: 180
      - query: SELECT type FROM system.columns WHERE database = 'test' AND table = 'orders_transformed' AND name = 'amount'
        value: Decimal(12, 2)
        node: ch
        timeout: 180
      - query: SELECT count() FROM test.orders FINAL WHERE id = 3 AND _peerdb_is_deleted = 0
        value: 0
        node: ch
        timeout: 180
      - query: SELECT count() FROM test.orders_transformed FINAL WHERE id = 3 AND _peerdb_is_deleted = 0
        value: 0
        node: ch
        timeout: 180
      - query: SELECT count() FROM test.orders_existing FINAL WHERE id = 3 AND _peerdb_is_deleted = 0
        value: 0
        node: ch
        timeout: 180

      - query: SELECT count() FROM test.orders FINAL WHERE id IN (2, 4, 5, 6) AND replication_stage = 'CDC change' AND ch_inserted_at IS NOT NULL AND replication_latency_ms = dateDiff('microsecond', updated_at, ch_inserted_at) / 1000.0 AND updated_at >= created_at
        value: 4
        node: ch
        timeout: 180
      - query: SELECT count() FROM test.orders FINAL WHERE id = 1 AND replication_stage = 'Initial snapshot' AND ch_inserted_at IS NULL AND replication_latency_ms IS NULL
        value: 1
        node: ch
        timeout: 180
      - query: SELECT count() FROM test.orders_existing FINAL WHERE id IN (2, 4, 5, 6) AND replication_stage = 'CDC change' AND ch_inserted_at IS NOT NULL AND replication_latency_ms = dateDiff('microsecond', updated_at, ch_inserted_at) / 1000.0 AND updated_at >= created_at
        value: 4
        node: ch
        timeout: 180
      - query: SELECT count() FROM test.orders_existing FINAL WHERE id = 1 AND replication_stage = 'Initial snapshot' AND ch_inserted_at IS NULL AND replication_latency_ms IS NULL
        value: 1
        node: ch
        timeout: 180
      - query: SELECT count() FROM test.orders_transformed FINAL WHERE id IN (2, 4, 5, 6) AND replication_stage = 'CDC change' AND ch_inserted_at IS NOT NULL AND replication_latency_ms = dateDiff('microsecond', updated_at, ch_inserted_at) / 1000.0 AND updated_at >= created_at
        value: 4
        node: ch
        timeout: 180
      - query: SELECT count() FROM test.orders_transformed FINAL WHERE id = 1 AND replication_stage = 'Initial snapshot' AND ch_inserted_at IS NULL AND replication_latency_ms IS NULL
        value: 1
        node: ch
        timeout: 180


      - query: SELECT count() FROM test.orders WHERE _peerdb_is_deleted != 0 AND replication_latency_ms IS NOT NULL
        value: 0
        node: ch
        timeout: 180
      - query: SELECT count() FROM test.orders_existing WHERE _peerdb_is_deleted != 0 AND replication_latency_ms IS NOT NULL
        value: 0
        node: ch
        timeout: 180
      - query: SELECT count() FROM test.orders_transformed WHERE _peerdb_is_deleted != 0 AND replication_latency_ms IS NOT NULL
        value: 0
        node: ch
        timeout: 180

    verify:
      sql: verify.sql
      expected: expected.txt
