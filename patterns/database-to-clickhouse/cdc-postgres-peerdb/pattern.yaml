tradeoffs:
  benefits:
    - "The initial load is split into row ranges along an ordered column such as an id or a timestamp, and the ranges are copied in parallel, so a failure only repeats the ranges that had not finished."
    - "Once streaming, each batch is a recorded step, so a worker that dies picks up at the next unfinished batch instead of replaying from the last saved position in the WAL."
    - "A step that fails retries on its own, with its own backoff, rather than stalling the pipeline until someone restarts it. This and the two points above all follow from running replication as Temporal workflows, whose durable execution model records each completed step."
    - "Reading the WAL and writing to ClickHouse are separate steps joined by a staging table, so a slow ClickHouse merge does not back up into the Postgres replication slot."
    - "Workers hold no state, so capacity is added by running more of them."
  drawbacks:
    - "Nine services beyond ClickHouse and the source database, where the Altinity sink needs one."
    - "PeerDB needs a store of its own. A second Postgres holds its mirror configuration and Temporal's workflow history, so there is another database to run, secure, and back up, entirely separate from the one being replicated."
    - "No in-flight transformation, because PeerDB has no per-message transform hook on the CDC path, so records land as produced and all shaping happens in ClickHouse."
    - "Current-state reads need ReplacingMergeTree FINAL semantics and a tombstone filter."
    - "A schema-owned target must keep PeerDB's metadata columns, and a transformation needs an explicit snapshot backfill."

# schema.sql provides orders_existing; PeerDB creates orders. load.py installs
# the transformation after the initial snapshot creates its source table.
