manifest_version: 2
metadata:
  title: CDC · MySQL binlog → Altinity lightweight sink → ClickHouse
  description: |-
    The Altinity lightweight sink replicates MySQL into ClickHouse over JDBC. Its embedded Debezium works in two phases:

    - **Snapshot:** reads the source tables to seed the ClickHouse copy.
    - **Streaming:** follows the binlog and applies every change as it commits.

    The Altinity lightweight sink is the only service to run with MySQL and ClickHouse, and it keeps its offsets and schema history in ClickHouse tables.

    The same CDC stream is inserted into three ClickHouse tables, each created differently:

    - `test.orders` is created by the connector, with types inferred from the source.
    - `test.orders_existing` is pre-created by the pattern, with deliberate types and a generated column.
    - `test.orders_transformed` is populated by a materialized view that transforms the rows from `test.orders`.

    The demo applies the same inserts, updates, and deletes to the two MySQL source tables. The sink never updates or deletes in ClickHouse: every change is inserted as a new row version (`_version`), and every delete as a tombstone (`is_deleted`). Read with `FINAL` and a tombstone filter, each of the three ClickHouse tables then returns the current state of the MySQL table — and because changes only ever arrive as inserts, the materialized view transforms new versions and tombstones like any other rows.

    The connector cannot transform records in flight: single-message transforms run inside the Kafka Connect runtime, which this lightweight deployment does not include. Records are inserted as Debezium produces them, so all shaping happens in ClickHouse, either in the target DDL or in a materialized view.

    The pattern runs Altinity sink `2.11.0-lt` on ClickHouse `26.9`. The sink bundles `clickhouse-jdbc` 0.9.8, which decodes only LZ4-compressed responses; ClickHouse 26.9 compresses responses with ZSTD by default ([clickhouse-java #3105](https://github.com/ClickHouse/clickhouse-java/issues/3105)). `compress=0` in `config/connector.yaml` turns response compression off for the sink's three JDBC connections.

    ### Following a row through the pipeline

    `replication_latency_ms` measures source row write → ClickHouse insert in milliseconds, using `updated_at` and `ch_inserted_at`. Snapshot and delete rows show `NULL`.

    Lower latency: reduce `poll.interval.ms` and `buffer.flush.time.ms` in `config/connector.yaml`; shorter waits increase CPU use and ClickHouse insert frequency.

    Edit the files in `config/`, then run `just reload` to rebuild the demo with the new settings. The **Configuration** panel displays the files.

    Inspect `test.orders` and `test.orders_existing` in **Data**: the source write times, connector `_version` and `is_deleted`, and destination insert time remain visible together. `_version` orders versions; the connector builds it from a source timestamp in milliseconds, floored so it never decreases, and the GTID transaction number. The materialized view copies `ch_inserted_at` and `replication_latency_ms` unchanged, so `test.orders_transformed` reports the arrival time in `test.orders`.

    The **Experiments** panel runs a timed insert workload with chosen values for the `config/` latency settings and records the latency per stage and the new parts per run.
  graph: |-
    snapshot:
      mysql:source_tables(label=2 MySQL sources,tables=test.orders + test.orders_existing)
        -[initial snapshot · Debezium]-> connector:altinity_sink(label=Altinity lightweight sink,system=Altinity CDC,state=offsets + schema history)

    snapshot:
      connector:altinity_sink
        -[snapshot · create target]-> mergetree:orders(label=test.orders,owner=connector-created)

    snapshot:
      connector:altinity_sink
        -[snapshot · existing target]-> mergetree:orders_existing(label=test.orders_existing,owner=pattern schema)

    changes:
      mysql:source_tables
        -[row-based MySQL binlog]-> connector:altinity_sink

    changes:
      connector:altinity_sink
        -[versions + tombstones]-> mergetree:orders

    changes:
      connector:altinity_sink
        -[versions + tombstones]-> mergetree:orders_existing

    transformation:
      mergetree:orders
        -> mv:orders_transform_mv(reads=orders only)
        -> mergetree:orders_transformed@mv-transformed(source=orders MV)
  status: under-review
  topology: single
  order: 3
  tags: [cdc, mysql]
  references:
    - label: Altinity lightweight insert scheduler (2.11.0)
      url: https://github.com/Altinity/clickhouse-sink-connector/blob/f6474042d0ab4dacd15f118b752c4fb8a8a0b1d8/sink-connector-lightweight/src/main/java/com/altinity/clickhouse/debezium/embedded/cdc/DebeziumChangeEventCapture.java#L3263-L3284
    - label: Altinity ClickHouse Sink Connector
      url: https://github.com/Altinity/clickhouse-sink-connector
    - label: Altinity 2.11.0 supported ClickHouse versions (24.8+)
      url: https://github.com/Altinity/clickhouse-sink-connector/blob/f6474042d0ab4dacd15f118b752c4fb8a8a0b1d8/doc/feature_matrix.md#L3-L9
    - label: Altinity 2.11.0 lightweight JDBC dependency (0.9.8)
      url: https://github.com/Altinity/clickhouse-sink-connector/blob/f6474042d0ab4dacd15f118b752c4fb8a8a0b1d8/sink-connector-lightweight/pom.xml#L529-L534
    - label: clickhouse-java compressed reads fail on ClickHouse 26.9+ (#3105)
      url: https://github.com/ClickHouse/clickhouse-java/issues/3105
    - label: Sink connector architecture (lightweight vs Kafka deployment)
      url: https://github.com/Altinity/clickhouse-sink-connector/blob/develop/doc/architecture.md
    - label: Debezium transformations (single-message transforms)
      url: https://debezium.io/documentation/reference/stable/transformations/applying-transformations-selectively.html
    - label: Lightweight connector configuration reference
      url: https://github.com/Altinity/clickhouse-sink-connector/blob/develop/sink-connector-lightweight/docker/config.yml
    - label: 'Single-process snapshot limits: slowdown and OOM on large initial loads'
      url: https://github.com/Altinity/clickhouse-sink-connector/issues/307
    - label: 'Recovery is a restart: lightweight connector stops replicating'
      url: https://github.com/Altinity/clickhouse-sink-connector/issues/380

  tradeoffs:
    benefits:
      - The lightweight connector embeds Debezium, so MySQL CDC reaches ClickHouse without operating Kafka, an orchestrator, a catalog database, or object storage.
      - The pipeline is one service beyond ClickHouse and the source, and all of its state is stored in ClickHouse tables, so there is no second stateful system to back up or reconcile.
      - Cost tracks change volume rather than table size, so a large table with few edits stays cheap where a scheduled full re-read would not.
      - Auto-create supports a connector-owned target while the same stream can be inserted into a deliberately pre-created ClickHouse schema.
      - ReplacingMergeTree versions and delete markers preserve current-state semantics for inserts, updates, and deletes.
    limitations:
      - "Reads must deduplicate versions and filter deletes, as with any ReplacingMergeTree table: FINAL or argMax for the versions, is_deleted = 0 for the tombstones."
      - "No in-flight transformation is possible: single-message transforms are a Kafka Connect runtime feature that the lightweight deployment lacks, so records are inserted as Debezium produces them and all shaping happens in ClickHouse."
      - The initial snapshot is a single embedded Debezium process, so large tables load serially and a failure restarts the snapshot rather than resuming it.
      - Binlog reading and ClickHouse writing share one pipeline, so a slow destination applies back pressure to the source.
      - Recovery is a process restart from the last flushed offset; there is no workflow history, no retry policy per step, and no second instance to fail over to.
      - Connector offsets and schema history are operational state that must remain durable and consistent with the ClickHouse targets.
      - Existing schemas must remain compatible with Debezium values while connector DDL and schema evolution are disabled.
      - "The bundled `clickhouse-jdbc` 0.9.8 fails every compressed read against ClickHouse 26.9+; the pattern sets `compress=0`."

spec:
  profiles: [cdc-ch, mysql, cdc-mysql]
  driver_node: ch-cdc

  services:
    cdc-mysql:
      config:
        - file: config/connector.yaml
          target: /config.yml
    mysql:
      init: source-init.sql

  experiments:
    - name: replication-latency
      title: Replication latency
      description: Inserts orders into MySQL at a fixed rate and measures the time from the MySQL write to the ClickHouse insert.
      script: experiments/replication_latency.py
      parameters:
        - name: poll_interval_ms
          label: Debezium poll interval (ms)
          short: poll ms
          group: Altinity connector
          default: 500
          min: 1
          config: {file: config/connector.yaml, key: poll.interval.ms}
        - name: buffer_flush_time_ms
          label: Sink buffer flush time (ms)
          short: flush ms
          group: Altinity connector
          default: 30
          min: 1
          config: {file: config/connector.yaml, key: buffer.flush.time.ms}
        - name: rate
          label: Rows per second
          short: requested/s
          group: MySQL
          default: 50
          min: 1
        - name: rows_per_txn
          label: Rows per transaction
          short: rows/txn
          group: MySQL
          default: 1
          min: 1
        - name: duration
          label: Duration (s)
          short: secs
          group: MySQL
          default: 10
          min: 1
      results:
        - name: rows
          label: rows
          group: MySQL
          description: Rows inserted into MySQL during the run.
        - name: achieved_rate
          label: actual/s
          group: MySQL
          description: Rows per second actually written to MySQL; below the requested rate when one connection cannot insert that fast.
        - name: p50_ms
          label: p50
          group: End to end (ms)
          description: Median time from the MySQL write to the ClickHouse insert, per row.
        - name: p95_ms
          label: p95
          group: End to end (ms)
          description: 95th percentile of the same per-row time.
        - name: p99_ms
          label: p99
          group: End to end (ms)
          description: 99th percentile of the same per-row time.
        - name: max_ms
          label: max
          group: End to end (ms)
          description: Slowest row.
        - name: parts
          label: parts
          group: ClickHouse
          description: New data parts in test.orders during the run (system.part_log).
        - name: part_write_avg_ms
          label: write avg
          group: ClickHouse
          description: Average time in ms ClickHouse took to write one new part (system.part_log duration_ms).
        - name: part_write_max_ms
          label: write max
          group: ClickHouse
          description: Slowest part write, in ms.
      groups: [MySQL, Altinity connector, ClickHouse, End to end (ms)]
      timeline_total: Average row latency (write to insert)

  steps:
    # ch-cdc initialization provides orders_existing before the connector starts;
    # the connector still creates orders. load.py installs the transformation after
    # the initial snapshot because its source table must exist first.
    schema:
    load: load.py

    ready_when:
      - query: SELECT engine FROM system.tables WHERE database = 'test' AND name = 'orders'
        value: ReplacingMergeTree
        node: ch-cdc
        timeout: 60
      - query: SELECT type FROM system.columns WHERE database = 'test' AND table = 'orders_existing' AND name = 'amount'
        value: Nullable(Int64)
        node: ch-cdc
        timeout: 60
      - query: SELECT type FROM system.columns WHERE database = 'test' AND table = 'orders_transformed' AND name = 'amount'
        value: Nullable(Decimal(12, 2))
        node: ch-cdc
        timeout: 60
      - query: SELECT count() FROM test.orders FINAL WHERE id = 3 AND is_deleted = 0
        value: 0
        node: ch-cdc
        timeout: 60
      - query: SELECT count() FROM test.orders_transformed FINAL WHERE id = 3 AND is_deleted = 0
        value: 0
        node: ch-cdc
        timeout: 60
      - query: SELECT count() FROM test.orders_existing FINAL WHERE id = 3 AND is_deleted = 0
        value: 0
        node: ch-cdc
        timeout: 60

      - query: SELECT count() FROM test.orders FINAL WHERE id IN (2, 4, 5, 6) AND replication_stage = 'CDC change' AND ch_inserted_at IS NOT NULL AND replication_latency_ms = dateDiff('microsecond', updated_at, ch_inserted_at) / 1000.0 AND updated_at >= created_at
        value: 4
        node: ch-cdc
        timeout: 180
      - query: SELECT count() FROM test.orders FINAL WHERE id = 1 AND replication_stage = 'Initial snapshot' AND ch_inserted_at IS NULL AND replication_latency_ms IS NULL
        value: 1
        node: ch-cdc
        timeout: 180
      - query: SELECT count() FROM test.orders_existing FINAL WHERE id IN (2, 4, 5, 6) AND replication_stage = 'CDC change' AND ch_inserted_at IS NOT NULL AND replication_latency_ms = dateDiff('microsecond', updated_at, ch_inserted_at) / 1000.0 AND updated_at >= created_at
        value: 4
        node: ch-cdc
        timeout: 180
      - query: SELECT count() FROM test.orders_existing FINAL WHERE id = 1 AND replication_stage = 'Initial snapshot' AND ch_inserted_at IS NULL AND replication_latency_ms IS NULL
        value: 1
        node: ch-cdc
        timeout: 180
      - query: SELECT count() FROM test.orders_transformed FINAL WHERE id IN (2, 4, 5, 6) AND replication_stage = 'CDC change' AND ch_inserted_at IS NOT NULL AND replication_latency_ms = dateDiff('microsecond', updated_at, ch_inserted_at) / 1000.0 AND updated_at >= created_at
        value: 4
        node: ch-cdc
        timeout: 180
      - query: SELECT count() FROM test.orders_transformed FINAL WHERE id = 1 AND replication_stage = 'Initial snapshot' AND ch_inserted_at IS NULL AND replication_latency_ms IS NULL
        value: 1
        node: ch-cdc
        timeout: 180

      - query: SELECT count() FROM test.orders WHERE is_deleted != 0 AND replication_latency_ms IS NOT NULL
        value: 0
        node: ch-cdc
        timeout: 180
      - query: SELECT count() FROM test.orders_existing WHERE is_deleted != 0 AND replication_latency_ms IS NOT NULL
        value: 0
        node: ch-cdc
        timeout: 180
      - query: SELECT count() FROM test.orders_transformed WHERE is_deleted != 0 AND replication_latency_ms IS NOT NULL
        value: 0
        node: ch-cdc
        timeout: 180

    verify:
      sql: verify.sql
      expected: expected.txt
