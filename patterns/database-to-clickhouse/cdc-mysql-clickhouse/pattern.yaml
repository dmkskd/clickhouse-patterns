manifest_version: 2
metadata:
  title: CDC · MySQL binlog → Altinity lightweight sink → ClickHouse
  description: |-
    The Altinity lightweight sink replicates MySQL into ClickHouse over JDBC. Its embedded Debezium works in two phases:

    - **Snapshot:** reads the source tables to seed the ClickHouse copy.
    - **Streaming:** follows the binlog and applies every change as it commits.

    The Altinity lightweight sink is the only service to run with MySQL and ClickHouse, and it keeps its offsets and schema history in ClickHouse tables.

    The same CDC stream lands in three ClickHouse tables, each created differently:

    - `test.orders` is created by the connector, with types inferred from the source.
    - `test.orders_existing` is pre-created by the pattern, with deliberate types and a generated column.
    - `test.orders_transformed` is populated by a materialized view that transforms the rows from `test.orders`.

    The demo applies the same inserts, updates, and deletes to the two MySQL source tables. The sink never updates or deletes in ClickHouse: every change lands as a new row version (`_version`), and every delete as a tombstone (`is_deleted`). Read with `FINAL` and a tombstone filter, each of the three ClickHouse tables then returns the current state of the MySQL table — and because changes only ever arrive as inserts, the materialized view transforms new versions and tombstones like any other rows.

    The connector cannot transform records in flight: single-message transforms run inside the Kafka Connect runtime, which this lightweight deployment does not include. Records land as Debezium produces them, so all shaping happens in ClickHouse, either in the target DDL or in a materialized view.

    This repository pins Altinity sink `2.9.1-lt` to ClickHouse `25.3` because its startup JDBC metadata reads fail against ClickHouse `26.6`.
  graph: |-
    snapshot:
      mysql:source_tables(label=2 MySQL sources,tables=test.orders + test.orders_existing)
        -[initial snapshot · Debezium]-> connector:altinity_sink(label=Altinity lightweight sink,system=Altinity CDC,state=offsets + schema history)

    snapshot:
      connector:altinity_sink
        -[snapshot · create target]-> mergetree:orders(label=test.orders,owner=connector-created)

    snapshot:
      connector:altinity_sink
        -[snapshot · existing target]-> mergetree:orders_existing(label=test.orders_existing,owner=pattern schema)

    changes:
      mysql:source_tables
        -[row-based MySQL binlog]-> connector:altinity_sink

    changes:
      connector:altinity_sink
        -[versions + tombstones]-> mergetree:orders

    changes:
      connector:altinity_sink
        -[versions + tombstones]-> mergetree:orders_existing

    transformation:
      mergetree:orders
        -> mv:orders_transform_mv(reads=orders only)
        -> mergetree:orders_transformed@mv-transformed(source=orders MV)
  status: stable
  topology: single
  order: 3
  tags: [cdc, mysql]
  references:
    - label: Altinity ClickHouse Sink Connector
      url: https://github.com/Altinity/clickhouse-sink-connector
    - label: Altinity 2.9.1 supported ClickHouse versions (24.8+)
      url: https://github.com/Altinity/clickhouse-sink-connector/blob/999b63d712212502583b4efe41a84d760c161e6a/doc/feature_matrix.md#L3-L9
    - label: Altinity 2.9.1 lightweight JDBC dependency (0.6.5)
      url: https://github.com/Altinity/clickhouse-sink-connector/blob/999b63d712212502583b4efe41a84d760c161e6a/sink-connector-lightweight/pom.xml#L474-L480
    - label: Sink connector architecture (lightweight vs Kafka deployment)
      url: https://github.com/Altinity/clickhouse-sink-connector/blob/develop/doc/architecture.md
    - label: Debezium transformations (single-message transforms)
      url: https://debezium.io/documentation/reference/stable/transformations/applying-transformations-selectively.html
    - label: Lightweight connector configuration reference
      url: https://github.com/Altinity/clickhouse-sink-connector/blob/develop/sink-connector-lightweight/docker/config.yml
    - label: 'Single-process snapshot limits: slowdown and OOM on large initial loads'
      url: https://github.com/Altinity/clickhouse-sink-connector/issues/307
    - label: 'Recovery is a restart: lightweight connector stops replicating'
      url: https://github.com/Altinity/clickhouse-sink-connector/issues/380

  tradeoffs:
    benefits:
      - The lightweight connector embeds Debezium, so MySQL CDC reaches ClickHouse without operating Kafka, an orchestrator, a catalog database, or object storage.
      - The pipeline is one service beyond ClickHouse and the source, and all of its state lives in ClickHouse tables, so there is no second stateful system to back up or reconcile.
      - Cost tracks change volume rather than table size, so a large table with few edits stays cheap where a scheduled full re-read would not.
      - Auto-create supports a connector-owned target while the same stream can land in a deliberately pre-created ClickHouse schema.
      - ReplacingMergeTree versions and delete markers preserve current-state semantics for inserts, updates, and deletes.
    limitations:
      - "Reads must deduplicate versions and filter deletes, as with any ReplacingMergeTree table: FINAL or argMax for the versions, is_deleted = 0 for the tombstones."
      - "No in-flight transformation is possible: single-message transforms are a Kafka Connect runtime feature that the lightweight deployment lacks, so records land as Debezium produces them and all shaping happens in ClickHouse."
      - The initial snapshot is a single embedded Debezium process, so large tables load serially and a failure restarts the snapshot rather than resuming it.
      - Binlog reading and ClickHouse writing share one pipeline, so a slow destination applies back pressure to the source.
      - Recovery is a process restart from the last flushed offset; there is no workflow history, no retry policy per step, and no second instance to fail over to.
      - Connector offsets and schema history are operational state that must remain durable and consistent with the ClickHouse targets.
      - Existing schemas must remain compatible with Debezium values while connector DDL and schema evolution are disabled.
      - This verified connector release is pinned to ClickHouse 25.3 in the pattern because its bundled JDBC startup path failed against the tested 26.6 release.

spec:
  profiles: [cdc-ch, mysql, cdc-mysql]
  driver_node: ch-cdc

  requires:
    clickhouse_max: '25.3'
    note: Ceiling is the Altinity sink's bundled clickhouse-jdbc, not a ClickHouse limit; its JDBC startup broke on ClickHouse 26.6.

  steps:
    # ch-cdc initialization provides orders_existing before the connector starts;
    # the connector still creates orders. load.py installs the transformation after
    # the initial snapshot because its source table must exist first.
    schema:
    load: load.py

    ready_when:
      - query: SELECT engine FROM system.tables WHERE database = 'test' AND name = 'orders'
        value: ReplacingMergeTree
        node: ch-cdc
        timeout: 60
      - query: SELECT type FROM system.columns WHERE database = 'test' AND table = 'orders_existing' AND name = 'amount'
        value: Nullable(Int64)
        node: ch-cdc
        timeout: 60
      - query: SELECT type FROM system.columns WHERE database = 'test' AND table = 'orders_transformed' AND name = 'amount'
        value: Nullable(Decimal(12, 2))
        node: ch-cdc
        timeout: 60
      - query: SELECT count() FROM test.orders FINAL WHERE id = 3 AND is_deleted = 0
        value: 0
        node: ch-cdc
        timeout: 60
      - query: SELECT count() FROM test.orders_transformed FINAL WHERE id = 3 AND is_deleted = 0
        value: 0
        node: ch-cdc
        timeout: 60
      - query: SELECT count() FROM test.orders_existing FINAL WHERE id = 3 AND is_deleted = 0
        value: 0
        node: ch-cdc
        timeout: 60

    verify:
      sql: verify.sql
      expected: expected.txt
