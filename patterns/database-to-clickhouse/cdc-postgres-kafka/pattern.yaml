manifest_version: 2
metadata:
  title: CDC · Postgres WAL → Debezium → Kafka → ClickHouse
  description: |-
    **Debezium** receives logically decoded row changes from Postgres and publishes them to the Kafka topic `pg.public.orders`. The **ClickHouse Kafka Connect Sink** reads `pg.public.orders` and inserts each change as a new version in `test.orders`. In this demo, both connectors run on one Kafka Connect worker.

    The ClickHouse Kafka Connect Sink is one consumer of `pg.public.orders`. A search index, a cache invalidator, or another team's service can consume the same records, each at its own pace. Postgres still serves a single replication slot.

    Each connector runs its own chain of **single-message transforms**, and any SMT can be added to either chain, whether one of Kafka Connect's built-ins for filtering, renaming, masking, and routing, or a custom one. On the **source side** an added transform applies to every consumer; on the **sink side** it applies only to the ClickHouse copy.

    Before publishing, `ExtractNewRecordState` flattens Debezium's before/after envelope, rewrites deletes, and includes the LSN in the `__lsn` field. On the sink side, a second transform adds the Kafka coordinates, so each row records the topic, partition, offset, and timestamp it arrived on.

    Whether to transform in the connectors or after the rows are inserted into ClickHouse is a design choice in its own right.

    This pattern runs the official **ClickHouse Kafka Connect Sink**. Anything that can consume the topic could take its place, including the **Altinity sink** in its Kafka mode and the **Kafka table engine**, where ClickHouse consumes the topic itself.

    The cost is two services to operate instead of one, plus topic retention and consumer offsets to manage.

    ### Following a row through the pipeline

    `replication_latency_ms` measures source row write → ClickHouse insert in milliseconds, using `updated_at` and `ch_inserted_at`. Snapshot and delete rows show `NULL`.

    Latency has two stages, one per connector:

    - **Postgres to Kafka (Debezium):** Debezium collects change events into a batch until it holds `max.batch.size` events (default 2048) or `poll.interval.ms` passes (`config/source.json`, default 500 ms), then publishes the batch. A lower interval publishes smaller batches sooner and raises CPU use on the Connect worker.
    - **Kafka to ClickHouse (sink):** the sink inserts the records of each consumer poll in one synchronous INSERT (it sets `async_insert=0`), and each INSERT creates a new part. `bufferCount` and `bufferFlushTime` in `config/sink.json` (default 0, off) collect records across polls into fewer, larger INSERTs, at the cost of latency.

    Edit the files in `config/`, then run `just reload` to rebuild the demo with the new settings. The **Configuration** panel displays the files.

    Inspect `test.orders` in **Data** to follow `updated_at` → `__source_ts_ms` (Debezium source-event time, epoch milliseconds) → `__timestamp` (Kafka record time) → `ch_inserted_at`. The source SMT preserves Debezium's snapshot marker as `__snapshot` as well as its event timestamp. The Kafka topic, partition and offset identify the intermediate record. These connector timestamps are kept separate from the source business write time.

    The **Experiments** panel runs a timed insert workload with chosen values for the `config/` latency settings and records the latency per stage and the new parts per run.
  graph: |-
    changes:
      postgres:orders(label=public.orders,note=**Live OLTP source**\nOne replication slot serves every consumer downstream.)
        -[logical WAL · pgoutput]-> connector:debezium(label=Debezium Postgres source,system=Kafka Connect,note=**Envelope flattening**\nThe ExtractNewRecordState transform rewrites each event before it reaches the topic.\n- keeps the after image\n- rewrites deletes as __deleted\n- adds the LSN as __lsn)
        -[flat JSON records]-> topic:orders(label=pg.public.orders,partitions=1)

    ingestion:
      topic:orders
        -[consumer group · HTTP insert batches]-> connector:clickhouse_sink(label=ClickHouse Sink,system=Kafka Connect,plugin=ClickHouseSinkConnector)
        -[versioned inserts]-> mergetree:orders(label=test.orders,engine=ReplacingMergeTree)

    fan-out:
      topic:orders
        -[independent consumer groups]-> client:other_consumers(label=other consumers,note=**Independent consumers**\nEach consumer group reads the same stream at its own pace.\n- search indexes · caches · audit stores\n- Postgres still serves a single replication slot)

    query:
      mergetree:orders
        -[FINAL · filter __deleted]-> client:readers(label=query clients)
  status: under-review
  topology: single
  order: 5
  tags: [cdc, postgres, kafka, debezium, kafka-connect]
  references:
    - label: Debezium polling interval (2.5.4)
      url: https://github.com/debezium/debezium/blob/v2.5.4.Final/debezium-core/src/main/java/io/debezium/config/CommonConnectorConfig.java#L477
    - label: Debezium connector for PostgreSQL
      url: https://debezium.io/documentation/reference/stable/connectors/postgresql.html
    - label: 'Debezium: New Record State Extraction (the unwrap SMT)'
      url: https://debezium.io/documentation/reference/stable/transformations/event-flattening.html
    - label: ClickHouse Kafka Connect Sink
      url: https://clickhouse.com/docs/integrations/kafka/clickhouse-kafka-connect-sink
    - label: 'ClickHouse: Kafka table engine (the pull alternative to this sink)'
      url: https://clickhouse.com/docs/engines/table-engines/integrations/kafka
    - label: Altinity sink in Kafka mode (an alternative to both connectors here)
      url: https://github.com/Altinity/clickhouse-sink-connector/blob/develop/doc/quickstart_kafka.md

  tradeoffs:
    benefits:
      - Every consumer reads the same change stream from the topic, so ClickHouse is one destination among several rather than the only one.
      - Adding a consumer costs a consumer group, not another replication slot or another read against Postgres.
      - The SMT chain runs between source and sink, so records can be flattened, filtered, renamed, or routed before any consumer sees them.
      - Topic retention decouples producer from consumer, so a ClickHouse outage is absorbed by the broker instead of stalling the WAL reader.
      - Both halves are replaceable on their own; the sink can be swapped for the Kafka table engine, or the source pointed at MySQL, without touching the other.
    limitations:
      - Two services to run beyond ClickHouse and the source, where a direct connector needs one.
      - Retention, partition count, and consumer offsets become operational concerns, and a topic that ages out before a consumer catches up loses data.
      - The record shape on the topic is a contract shared by every consumer, so an SMT or schema change has to account for all of them.
      - Ordering holds only within a partition, so keying and partition count decide whether a row's changes stay in order.
      - Current-state reads still need ReplacingMergeTree FINAL semantics and a filter on the rewritten delete marker.

spec:
  profiles: [single, postgres, kafka, connect]
  driver_node: ch

  services:
    postgres:
      init: source-init.sql

  experiments:
    - name: replication-latency
      title: Replication latency
      description: |-
        Inserts orders into Postgres at a fixed rate and measures the time from the Postgres write to the ClickHouse insert.
        The Kafka broker, the Connect producer and consumer, and the ClickHouse sink use default settings.
      script: experiments/replication_latency.py
      parameters:
        - name: poll_interval_ms
          label: Debezium poll interval (ms)
          short: poll ms
          group: Debezium
          default: 500
          min: 1
          config: {file: config/source.json, key: poll.interval.ms}
        - name: rate
          label: Rows per second
          short: requested/s
          group: Postgres
          default: 50
          min: 1
        - name: rows_per_txn
          label: Rows per transaction
          short: rows/txn
          group: Postgres
          default: 1
          min: 1
        - name: duration
          label: Duration (s)
          short: secs
          group: Postgres
          default: 10
          min: 1
      results:
        - name: rows
          label: rows
          group: Postgres
          description: Rows inserted into Postgres during the run.
        - name: achieved_rate
          label: actual/s
          group: Postgres
          description: Rows per second actually written to Postgres; below the requested rate when one connection cannot insert that fast.
        - name: p50_ms
          label: p50
          group: End to end (ms)
          description: Median time from the Postgres write to the ClickHouse insert, per row.
        - name: p95_ms
          label: p95
          group: End to end (ms)
          description: 95th percentile of the same per-row time.
        - name: p99_ms
          label: p99
          group: End to end (ms)
          description: 99th percentile of the same per-row time.
        - name: max_ms
          label: max
          group: End to end (ms)
          description: Slowest row.
        - name: parts
          label: parts
          group: ClickHouse
          description: New data parts in test.orders during the run (system.part_log).
        - name: async_buffer_avg_ms
          label: buffer avg
          group: ClickHouse
          description: Average time in ms an INSERT's data waited in ClickHouse's async insert buffer until the flush (system.asynchronous_insert_log). Empty when the INSERTs are synchronous.
        - name: async_buffer_max_ms
          label: buffer max
          group: ClickHouse
          description: Longest async insert buffer wait, in ms.
        - name: part_write_avg_ms
          label: write avg
          group: ClickHouse
          description: Average time in ms ClickHouse took to write one new part (system.part_log duration_ms).
        - name: part_write_max_ms
          label: write max
          group: ClickHouse
          description: Slowest part write, in ms.
      groups: [Postgres, Debezium, ClickHouse, End to end (ms)]
      timeline_total: Average row latency (write to insert)

  steps:
    schema: schema.sql
    load: load.py

    ready_when:
      - query: SELECT count() FROM test.orders FINAL WHERE __deleted = 'false'
        value: 5
        node: ch
        timeout: 180
      - query: SELECT count() FROM test.orders FINAL WHERE id = 4 AND __deleted = 'false'
        value: 1
        node: ch
        timeout: 180
      - query: SELECT amount FROM test.orders FINAL WHERE id = 2
        value: 250
        node: ch
        timeout: 180
      - query: SELECT count() FROM test.orders FINAL WHERE id = 3 AND __deleted = 'false'
        value: 0
        node: ch
        timeout: 180

      - query: SELECT count() FROM test.orders FINAL WHERE id IN (2, 4, 5, 6) AND replication_stage = 'CDC change' AND ch_inserted_at IS NOT NULL AND replication_latency_ms = dateDiff('microsecond', updated_at, ch_inserted_at) / 1000.0 AND updated_at >= created_at
        value: 4
        node: ch
        timeout: 180
      - query: SELECT count() FROM test.orders FINAL WHERE id = 1 AND replication_stage = 'Initial snapshot' AND ch_inserted_at IS NULL AND replication_latency_ms IS NULL
        value: 1
        node: ch
        timeout: 180


      - query: SELECT count() FROM test.orders WHERE __deleted = 'true' AND replication_latency_ms IS NOT NULL
        value: 0
        node: ch
        timeout: 180

    verify:
      sql: verify.sql
      expected: expected.txt
