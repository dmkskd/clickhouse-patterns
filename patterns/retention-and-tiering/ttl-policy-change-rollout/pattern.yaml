manifest_version: 1
status: wip
title: "Changing TTL on existing data"
description: |-
  On a populated table, a TTL change alters the table definition and the data
  that the table already holds.

  By default, `ALTER TABLE ... MODIFY TTL` materializes the new policy for
  existing parts, so the new rule starts being applied to stored data
  immediately. On a large table, that materialization can create substantial
  background removal, rewrite, or relocation work.

  To change the policy without starting that work and decide when it happens:

  - Run `ALTER TABLE ... MODIFY TTL ...` with `materialize_ttl_after_modify = 0`
    to change only the table definition. Existing parts keep the TTL metadata
    of the previous policy, so background merges do not treat them as expired.
  - Later, apply the new rule to selected existing data with
    `MATERIALIZE TTL IN PARTITION ...`. That is a mutation: it rewrites the
    partition's parts and enforces the new policy on them.

  This pattern runs the rollout on a table holding two months of history, both
  already past 30 days and both still within the one-year policy the table
  starts with. It shortens retention to 30 days without materializing, then
  materializes the earlier month only, and verifies that the later month still
  holds its rows under the deadline the one-year policy gave them.
graph: |-
  history:
    client:writer -[monthly batches]-> mergetree:events(label=demo.events,note=**Table**\n- PARTITION BY toYYYYMM(event_time)\n- Starts at event_time + 1 year DELETE\n- Holds two months of history)

  policy_change:
    client:operator -[MODIFY TTL · materialize_ttl_after_modify=0]-> mergetree:events

  staged_rollout:
    mergetree:events -[MATERIALIZE TTL · one partition]-> part:earlier_month(label=earlier month,note=**Mutation rewrite**\n- Rows past 30 days are dropped under the new policy\n- The later month keeps its one-year deadline\n- Its rows are dropped only when it is materialized in turn)
category: retention
flow: transform
topology: single
order: 3
tags: [ttl, operations, alter, materialize, rollout]
profiles: [single]
driver_node: ch
schema_sql: schema.sql
load: load.py
ready_when:
  - query: >-
      SELECT count() FROM demo.events
    value: 3
    timeout: 60
  - query: >-
      SELECT countIf(is_done) FROM system.mutations
      WHERE database = 'demo' AND table = 'events'
    value: 1
    timeout: 60
verify:
  sql: verify.sql
  expected: expected.txt
references:
  - label: "Altinity: modifying and materializing TTL"
    url: https://kb.altinity.com/altinity-kb-queries-and-syntax/ttl/modify-ttl/
  - label: "ClickHouse: Manage data with TTL"
    url: https://clickhouse.com/docs/concepts/features/operations/delete/ttl
tradeoffs:
  benefits:
    - Keeps the table definition and existing data aligned when applying the change at once is appropriate.
    - Allows a large policy change to be applied partition by partition.
  drawbacks:
    - The default materialization can start broad TTL work across historical parts.
    - Staging requires an explicit operational rollout rather than a metadata-only ALTER.
    - While the rollout is incomplete, retention differs between materialized and staged partitions.
