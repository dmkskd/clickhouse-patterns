manifest_version: 1
mode: reference
status: wip
title: "TTL GROUP BY: downsample historical detail"
description: |-
  Use `GROUP BY ... SET ...` TTL when old detail can be replaced with coarser
  historical rows. For example, keep individual events for seven days, then
  retain hourly counts and sums in the same table.

  This is a rewrite, not an insert-time materialized-view rollup. The `GROUP BY`
  keys must be a prefix of the primary key, and the table needs columns that can
  hold the aggregate results. Once the TTL merge runs, the original detail is
  gone. Choose the age boundary and buckets from the questions users need to
  answer, then measure merge cost and historical-query behaviour.
graph: |-
  ingest:
    client:writer -> mergetree:metrics(engine=MergeTree,ttl=GROUP BY)

  downsample:
    mergetree:metrics -[TTL GROUP BY · old detail to buckets]-> part:rollup(label=aggregated historical part)
category: retention
flow: transform
topology: single
order: 5
tags: [ttl, group-by, rollup, downsampling, rewrite]
profiles: []
references:
  - label: "ClickHouse: Manage data with TTL"
    url: https://clickhouse.com/docs/concepts/features/operations/delete/ttl
tradeoffs:
  benefits:
    - Keeps recent detail while shrinking older data to the resolution users need.
    - Avoids maintaining a second historical aggregate table.
  drawbacks:
    - Rewrites parts and competes with ordinary merges for resources.
    - Old detail is irrecoverable, and the primary key must accommodate the TTL grouping keys.
