manifest_version: 2
metadata:
  title: 'TTL move: hot/cold storage with S3'
  description: |-
    A MOVE TTL keeps recent parts of a MergeTree table on local hot storage
    and moves older parts to S3-backed cold storage, while queries read across
    both through the same table. When the table has multiple replicas, see the
    [[ttl-move-to-s3-replicated|replicated companion pattern]].

    A `TO VOLUME` or `TO DISK` TTL moves the files of each MergeTree part that
    meets its TTL condition from one storage tier to another. Across tiers,
    ClickHouse copies the part to the destination, switches the active part, and
    retires the source for later cleanup. Use it for a hot/warm/cold lifecycle:
    local storage for recent writes and low-latency reads, then an S3-backed disk
    for older parts.

    **When a part moves.** MOVE TTL is asynchronous background work and moves
    whole parts, never single rows. A part becomes movable only when its
    newest row satisfies the TTL: for `event_time + INTERVAL 30 DAY`, when the
    newest row's `event_time` is more than 30 days in the past. The actual
    move time then depends on:

    - **Move cooldown:** `merge_with_ttl_timeout` (default four hours) bounds
      how often ClickHouse schedules TTL work. It delays when an eligible part
      is picked up; it does not re-move or rewrite a part on every interval.
    - **Capacity:** selected moves wait for a background mover slot; watch
      `system.moves` and `system.part_log` for progress.

    This example defines its own storage policy, `tiered`, with a local hot
    tier and an S3-backed cold tier. The table selects that policy with
    `SETTINGS storage_policy = 'tiered'` and names the cold tier in its TTL.
    An already-eligible inserted part moves immediately by default;
    `perform_ttl_move_on_insert = 0` defers that potentially slow S3 write to the
    background mover. Inspect `system.parts.disk_name`, `system.part_log`, and
    `system.moves` to see the actual move.
  graph: |-
    ingest:
      client:writer -> mergetree:tiered_events(label=demo.tiered_events,engine=MergeTree,policy=tiered,ttl=event_time+30d TO VOLUME cold)

    tiering:
      mergetree:tiered_events -[whole eligible parts · TTL move]-> minio:cold_parts(bucket=clickhouse,prefix=ttl-tiered/,label=S3 cold volume)

    query:
      mergetree:tiered_events -[transparent reads across local and S3 parts]-> client:reader
  status: under-review
  topology: single
  order: 7
  tags: [ttl, tiering, s3, storage-policy, volume, move, minio]
  references:
    - label: 'ClickHouse: Manage data with TTL'
      url: https://clickhouse.com/docs/concepts/features/operations/delete/ttl
    - label: 'ClickHouse: External disks for storing data'
      url: https://clickhouse.com/docs/concepts/features/configuration/server-config/storing-data
    - label: 'Altinity: TTL moves and multi-volume storage'
      url: https://altinity.com/blog/2020-3-23-putting-things-where-they-belong-using-new-ttl-moves
  related_patterns:
    - slug: ttl-policy-change-rollout
      note: Read before changing this table's TTL on existing data.
  tradeoffs:
    benefits:
      - Moves whole eligible parts to lower-cost storage rather than rewriting individual rows.
      - Keeps table and query semantics intact while making recent and historical placement explicit.
    limitations:
      - Needs server storage configuration and careful S3 operational design, rather than SQL alone.
      - Older reads may be slower or cost more, so a cache and workload measurement are often necessary.
      - A part moves only when its newest row passes the TTL, so coarse partitions can keep old rows on the hot tier far longer than the TTL suggests.

spec:
  profiles: [single, s3]
  driver_node: ch
  services:
    clickhouse:
      config:
        - node: ch
          file: config/tiered-storage.xml
          depends_on: [minio-init]
  steps:
    schema: schema.sql
    load: load.py
    ready_when:
      - query: >-
          SELECT count() FROM system.parts
          WHERE database = 'demo' AND table = 'tiered_events'
            AND active AND disk_name = 'cold_s3'
        value: 1
        node: ch
        timeout: 60
      - query: >-
          SELECT count() FROM system.parts
          WHERE database = 'demo' AND table = 'tiered_events'
            AND active AND disk_name = 'default'
        value: 1
        node: ch
        timeout: 60
      - query: >-
          SELECT count() FROM system.part_log
          WHERE database = 'demo' AND table = 'tiered_events'
            AND event_type = 'MovePart'
        value: 1
        node: ch
        timeout: 60
    verify:
      sql: verify.sql
      expected: expected.txt
