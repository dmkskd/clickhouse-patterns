title: TTL retention & tiering
label: TTL
description: Use TTL to delete, rewrite, roll up, recompress, or move expired data in MergeTree-family tables
icon: clock
order: 6
intro: |-
  ClickHouse TTL applies lifecycle policies to MergeTree-family tables.

  - **Deletion:** remove data after its retention period.
  - **Privacy:** erase selected column values while retaining the other columns
    in the row.
  - **Recompression:** change the storage encoding of eligible parts.
  - **Downsampling:** replace expired raw rows with aggregate rows.
  - **Tier placement:** move eligible parts to another disk or volume.

  TTL policies have different write, CPU, and storage costs. Check each pattern
  for its trade-offs and what to monitor.

related:
  - group: aggregation-rollups
    note: For materialized-view rollups maintained at ingest rather than as data expires
  - group: s3-to-clickhouse
    note: For object storage as an input or backup target rather than a MergeTree tier
