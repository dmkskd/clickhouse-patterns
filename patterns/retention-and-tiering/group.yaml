title: TTL retention & tiering
label: TTL
description: Use TTL to delete, rewrite, roll up, recompress, or move aging MergeTree data
icon: database
order: 6
intro: |-
  ClickHouse TTL applies lifecycle policies to MergeTree data.

  - **Deletion:** remove data after its retention period.
  - **Privacy:** erase selected column values while retaining the other columns
    in the row.
  - **Recompression:** change the storage encoding of older parts.
  - **Downsampling:** replace old detailed rows with aggregate rows.
  - **Tier placement:** move eligible parts to another disk or volume.

  TTL policies have different write, CPU, and storage costs. Check each pattern
  for its trade-offs and what to monitor.

advisories:
  - title: "Changing a TTL policy"
    summary: "On a populated table, a TTL change is an operational change."
    body: |-
      `ALTER TABLE ... MODIFY TTL` materializes the new policy for existing
      parts by default. DELETE, RECOMPRESS, and GROUP BY can therefore start
      broad background removal or rewrite work; MOVE re-evaluates existing
      parts for relocation. Set `materialize_ttl_after_modify = 0` to stage the
      rollout, then materialize selected partitions deliberately.
    link_label: "Read the rollout guidance"
    link_pattern: ttl-policy-change-rollout

related:
  - group: aggregation-rollups
    note: For materialized-view rollups maintained at ingest rather than by aging data
  - group: s3-to-clickhouse
    note: For object storage as an input or backup target rather than a MergeTree tier
