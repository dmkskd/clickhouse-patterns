title: Rollups
description: Aggregates over raw rows
icon: rollup
order: 1
intro: |-
  A rollup is an aggregate over raw rows, grouped by a set of dimensions and a
  time granularity, kept up to date as new data arrives. ClickHouse offers
  several ways to build and maintain rollups:

  - **On read.** No stored rollup: a `GROUP BY` over the raw table at query time.
  - **At insert time.** As new rows arrive, a materialized view updates a stored rollup.
  - **Cascaded.** A materialized view builds a coarser rollup from a finer rollup already computed.
  - **On a schedule.** A refreshable materialized view reruns a full query and replaces its output.

  The following patterns are ordered by how much of the work moves off the read
  path. The first three build OHLC candles (open, high, low and close price per
  interval) from the same stream of financial market data, so their results can
  be compared directly. The fourth revalues a trading book at the latest price,
  an answer that changes when no row has been inserted and that an
  insert-triggered view therefore has no way to produce.
