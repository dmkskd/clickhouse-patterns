title: Rollups
description: Aggregate raw data into summary views
icon: rollup
order: 1
intro: |-
  A rollup is an aggregated summary of raw rows, grouped into defined buckets.
  ClickHouse supports several ways to create and maintain these summaries:

  - **On read.** A `GROUP BY` over the raw table, calculated when queried.
  - **At insert time.** As new rows arrive, a materialized view updates a stored summary.
  - **Cascaded.** A materialized view builds a coarser summary from a finer summary already computed.
  - **On a schedule.** A refreshable materialized view reruns a full query and replaces its output.

  The following patterns are ordered by how much of the work moves off the read
  path. The first three build OHLC candles from the same stream of market
  data, so their results can be compared directly. The fourth revalues a
  trading book at the latest price, an answer that changes when no row has been
  inserted and that an insert-triggered view therefore has no way to produce.
