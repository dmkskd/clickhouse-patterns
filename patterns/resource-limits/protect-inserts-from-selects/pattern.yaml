manifest_version: 2
metadata:
  title: Protecting inserts from SELECT load
  description: |-
    Protects INSERT traffic from competing SELECT queries using per-user
    concurrency limits, reservation admission or tracked-memory limits on one server.

    ### Fixed concurrency

    - SELECT queries run as `traffic_reader`.
    - INSERT batches run as `traffic_writer`.
    - `ALTER USER` in `schema.sql` configures `max_concurrent_queries_for_user` for `traffic_reader`. The experiment varies this limit with `read_slots`.
    - The limit counts all concurrent queries from `traffic_reader`. Excess requests fail with `TOO_MANY_SIMULTANEOUS_QUERIES`.
    - `traffic_writer` has separate per-user accounting. Both users share the server-wide `max_concurrent_queries = 32` limit configured in XML.

    ### Workload memory admission

    - Reservation-based admission control assigns SELECTs and INSERTs to separate `WORKLOAD`s under a `MEMORY RESERVATION` resource.
    - Clients declare a per-query memory reservation with `reserve_memory`. The server checks each reservation against the workload's `max_memory` budget.
    - SELECTs wait for reservation capacity. An expired `workload_admission_timeout_ms` returns `MEMORY_RESERVATION_ACQUISITION_TIMEOUT`.
    - INSERTs have a separate workload and reservation budget.

    ### Server memory enforcement

    - The server assigns each user to its workload and fixes `reserve_memory = 0` with setting constraints.
    - Memory-intensive SELECTs grow the reader workload's tracked memory. Its `max_memory` limit can terminate running queries.
    - INSERTs use a separate writer workload and memory limit. Query timing and runtime allocations determine which SELECTs fail.

    The experiments compare write throughput, write latency and SELECT outcomes
    under steady or burst SELECT traffic. Reader admission policies provide
    workload isolation on one server, with shared CPU, memory and storage.
    ClickHouse Cloud warehouses provide compute-compute separation with separate
    compute services sharing the same data.
  mode: runnable
  status: wip
  topology: single
  order: 2
  tags:
  - admission
  - max_concurrent_queries_for_user
  - ingestion
  - workload-isolation
  graph: |-
    reads:
      client:readers(label=traffic_reader,note=Reader clients\nCPU-bound SELECT queries over numbers())
        -[SELECT · admission policy]-> clickhouse:server(label=ClickHouse server,note=**Fixed concurrency**\ntraffic_reader uses max_concurrent_queries_for_user = read_slots.\nExcess requests fail with TOO_MANY_SIMULTANEOUS_QUERIES.\n**Workload memory admission**\nThe reader WORKLOAD limits total reserved memory with max_memory.\nClients declare per-query reserve_memory.\nSELECTs wait for reservation capacity.\nAn expired memory wait returns MEMORY_RESERVATION_ACQUISITION_TIMEOUT.\n**Server memory enforcement**\nUser settings fix workload assignment and reserve_memory = 0.\nWorkload max_memory can terminate memory-intensive SELECTs during execution.\n**Writer admission**\ntraffic_writer has separate per-user accounting and a separate WORKLOAD in the memory experiment.\nServer limit: max_concurrent_queries = 32.\nCPU, memory and storage remain shared.)
    writes:
      client:writers(label=traffic_writer,note=Writer clients\nSynchronous INSERT batches into demo.events)
        -[INSERT · separate user]-> clickhouse:server -[INSERT batches]-> mergetree:events(label=demo.events)
  references:
  - label: ClickHouse concurrency controls
    url: https://clickhouse.com/resources/engineering/high-concurrency-sizing-user-analytics
  - label: Per-user concurrency limit
    url: https://clickhouse.com/docs/reference/settings/session-settings/max-concurrent#max_concurrent_queries_for_user
  - label: Compute-compute separation in ClickHouse Cloud
    url: https://clickhouse.com/docs/cloud/reference/warehouses
  - label: Workload memory reservations
    url: https://clickhouse.com/docs/operations/workload-scheduling#memory-reservations
  tradeoffs:
    benefits:
    - Read concurrency or reserved memory can be bounded independently of INSERT admission on one server.
    - Workload memory admission can queue reads during short periods of contention and admit them as reservation capacity becomes available.
    limitations:
    - Accepted reads and INSERTs compete for CPU, memory and IO on the same server.
    - Reader limits can increase SELECT admission latency or reject SELECT requests.
    - Per-user isolation depends on applications using separate reader and writer credentials.
    - Reservation-based admission depends on declared resource requirements. This example supplies per-query reservations from the client.
spec:
  profiles:
  - single
  driver_node: ch
  requires:
    clickhouse_min: '26.9'
  services:
    clickhouse:
      config:
      - node: ch
        file: config/admission.xml
  steps:
    schema: schema.sql
    load: load.sql
    ready_when:
    - query: SELECT count() FROM demo.events WHERE run_id = toUUID('00000000-0000-0000-0000-000000000000')
      value: 1
    verify:
      sql: verify.sql
      expected: expected.txt
  experiments:
  - name: protect-writes
    title: Fixed concurrency
    description: |-
      Limits how many SELECTs `traffic_reader` can run at once with
      `max_concurrent_queries_for_user`. ClickHouse rejects SELECTs above the limit
      with `TOO_MANY_SIMULTANEOUS_QUERIES`. INSERTs run as `traffic_writer` and the
      limit does not apply to them. The results show how INSERT throughput and
      latency change with the SELECT limit.
    script: experiments/protect_writes.py
    views:
    - type: time-series
      source: resource_history
      label: Query admission
      intervals:
        source: requests
        group_field: role
        id_field: query_id
        size_field: admission_units
        size_unit: queries
        size_label: Query counts
        admitted_field: server.event
        admitted_values: [QueryFinish, ExceptionWhileProcessing]
        lanes:
          read: SELECT
          write: INSERT
        details:
          query_id: query_id
          Error: error_name
          query_log event: server.event
          Server duration (ms): server.duration_ms
    - type: intervals
      source: requests
      label: Request timeline
      lanes:
        read: SELECT
        write: INSERT
      details:
        query_id: query_id
        Error code: error_code
        query_log event: server.event
        Server duration (ms): server.duration_ms
        Server memory (bytes): server.memory_bytes
    parameters:
    - name: read_slots
      label: Concurrent SELECT limit
      description: Maximum concurrent queries for traffic_reader. A value of 0 disables this per-user limit.
      short: limit
      group: SELECT limit
      default: 2
      choices:
      - 0
      - 1
      - 2
      - 4
    - name: read_rate
      label: SELECTs per second
      description: Number of SELECT requests scheduled each second. Every scheduled request is attempted once.
      short: req/s
      group: SELECT workload
      default: 8
      choices:
      - 4
      - 8
      - 16
    - name: read_shape
      label: SELECT timing
      description: Steady spaces SELECTs evenly through each second. Burst sends each second’s SELECTs together.
      short: arrivals
      group: SELECT workload
      default: burst
      choices:
      - steady
      - burst
    - name: read_rows
      label: Numbers per SELECT
      description: Number of generated integers hashed by each SELECT. Larger values increase query CPU work and usually extend its duration.
      short: rows/query
      group: SELECT workload
      default: 50000000
      choices:
      - 1000000
      - 10000000
      - 50000000
    - name: write_rate
      label: INSERTs per second
      description: Number of INSERT batches scheduled each second, evenly spaced.
      short: req/s
      group: INSERT workload
      default: 5
      choices:
      - 2
      - 5
      - 10
      - 20
    - name: batch_rows
      label: Rows per INSERT
      description: Number of rows written by each INSERT batch.
      short: rows/insert
      group: INSERT workload
      default: 1000
      choices:
      - 100
      - 1000
      - 10000
    - name: duration
      label: Traffic duration (s)
      description: Number of seconds to generate traffic. Requests still running at the end are allowed to finish before results are collected.
      short: duration
      group: Run
      default: 5
      choices:
      - 5
      - 10
      - 20
    results:
    - name: write_completed
      label: completed
      group: INSERT results
      description: Acknowledged INSERT requests.
    - name: write_rejected
      label: rejected
      group: INSERT results
      description: INSERT requests rejected with concurrency error 202.
    - name: write_failed
      label: failed
      group: INSERT results
      description: Other INSERT failures, including transport failures.
    - name: write_p95_ms
      label: p95 ms
      group: INSERT results
      description: 95th percentile client elapsed time of successful INSERTs.
    - name: write_rows_per_second
      label: rows/s
      group: INSERT results
      description: Stored rows divided by the measured run duration, including request drain.
    - name: expected_rows
      label: expected rows
      group: INSERT results
      description: Acknowledged INSERT requests multiplied by rows per INSERT.
    - name: stored_rows
      label: stored rows
      group: INSERT results
      description: Rows verified in demo.events for this run ID.
    - name: read_completed
      label: completed
      group: SELECT results
      description: Completed SELECT requests.
    - name: read_rejected
      label: rejected
      group: SELECT results
      description: SELECT requests rejected with concurrency error 202.
    - name: read_failed
      label: failed
      group: SELECT results
      description: Other SELECT failures, including execution timeouts.
    - name: read_p95_ms
      label: p95 ms
      group: SELECT results
      description: 95th percentile client elapsed time of successful SELECTs.
    - name: peak_reads
      label: peak active
      group: SELECT results
      description: Maximum reader queries observed in 20 ms process-list samples.
    groups:
    - Run
    - SELECT limit
    - SELECT workload
    - SELECT results
    - INSERT workload
    - INSERT results
  - name: protect-writes-memory
    title: Workload memory admission
    description: |-
      Each SELECT declares a memory reservation with `reserve_memory`. ClickHouse
      starts the SELECT when its reservation and those of the running SELECTs fit
      within the `max_memory` budget of the reader workload. INSERTs reserve 16 MiB
      each from a separate writer workload with a 64 MiB budget. Fixed reservation
      sizes make the effect of different budgets easier to compare.

      When concurrent reservations exhaust the budget, SELECTs wait for capacity.
      If the Memory wait timeout expires, ClickHouse returns
      `MEMORY_RESERVATION_ACQUISITION_TIMEOUT`. A budget of 0 disables this limit.
    script: experiments/protect_memory.py
    views:
    - type: time-series
      source: resource_history
      label: Workload activity
      intervals:
        source: requests
        label: SELECT and INSERT requests
        group_field: workload
        id_field: query_id
        size_field: reservation_mib
        size_unit: MiB
        size_label: Requested reservations
        admitted_field: server.event
        admitted_values: [QueryFinish, ExceptionWhileProcessing]
        lanes:
          read: SELECT
          write: INSERT
        details:
          query_id: query_id
          Error code: error_code
          query_log event: server.event
          Server duration (ms): server.duration_ms
          Server memory (bytes): server.memory_bytes
          Error: error_name
          Reservation (MiB): reservation_mib
          Workload: workload
    - type: intervals
      source: requests
      label: Request timeline
      lanes:
        read: SELECT
        write: INSERT
      details:
        query_id: query_id
        Error code: error_code
        query_log event: server.event
        Server duration (ms): server.duration_ms
        Server memory (bytes): server.memory_bytes
        Error: error_name
        Reservation (MiB): reservation_mib
        Workload: workload
    parameters:
    - name: read_memory_mib
      label: SELECT memory budget (MiB)
      description: Total memory reservations allowed for the reader workload at once. A value of 0 disables this budget.
      short: budget MiB
      group: Memory policy
      default: 64
      choices:
      - 0
      - 32
      - 64
      - 128
      - 256
    - name: read_reserve_mib
      label: SELECT reservation (MiB)
      description: Value sent as the per-query reserve_memory setting. Alternate uses this value for every second SELECT and 8 MiB for the others.
      short: reserve MiB
      group: Memory policy
      default: 32
      choices:
      - 16
      - 32
      - 64
    - name: reservation_mix
      label: SELECT reservation sizes
      description: >-
        Same size: every SELECT requests the selected reservation.
        Alternate: SELECTs alternate between 8 MiB and the selected reservation.
        For 32 MiB, the sequence is 8, 32, 8, 32 MiB.
      short: mix
      group: Memory policy
      default: mixed
      choices:
      - value: uniform
        label: Same size
      - value: mixed
        label: Alternate
    - name: admission_wait_ms
      label: Memory wait timeout (ms)
      description: Time allowed for the requested reservation to fit in the workload budget. ClickHouse rejects the SELECT when this wait expires.
      short: wait ms
      group: Memory policy
      default: 20
      choices:
      - 5
      - 20
      - 100
      - 500
    - name: read_rate
      label: SELECTs per second
      description: Number of SELECT requests scheduled each second. Every scheduled request is attempted once.
      short: req/s
      group: SELECT workload
      default: 8
      choices:
      - 4
      - 8
      - 16
    - name: read_shape
      label: SELECT timing
      description: Steady spaces SELECTs evenly through each second. Burst sends each second’s SELECTs together.
      short: arrivals
      group: SELECT workload
      default: burst
      choices:
      - steady
      - burst
    - name: read_rows
      label: Numbers per SELECT
      description: Number of generated integers hashed by each SELECT. Larger values increase query CPU work and usually extend its duration.
      short: rows/query
      group: SELECT workload
      default: 50000000
      choices:
      - 1000000
      - 10000000
      - 50000000
    - name: write_rate
      label: INSERTs per second
      description: Number of INSERT batches scheduled each second, evenly spaced.
      short: req/s
      group: INSERT workload
      default: 5
      choices:
      - 2
      - 5
      - 10
      - 20
    - name: batch_rows
      label: Rows per INSERT
      description: Number of rows written by each INSERT batch.
      short: rows/insert
      group: INSERT workload
      default: 1000
      choices:
      - 100
      - 1000
      - 10000
    - name: duration
      label: Traffic duration (s)
      description: Number of seconds to generate traffic. Requests still running at the end are allowed to finish before results are collected.
      short: duration
      group: Run
      default: 5
      choices:
      - 5
      - 10
      - 20
    results:
    - name: write_completed
      label: completed
      group: INSERT results
      description: Acknowledged INSERT requests.
    - name: write_rejected
      label: rejected
      group: INSERT results
      description: Requests rejected during admission with concurrency, workload overload or memory-reservation
        timeout errors.
    - name: write_failed
      label: failed
      group: INSERT results
      description: Other INSERT failures, including transport failures.
    - name: write_p95_ms
      label: p95 ms
      group: INSERT results
      description: 95th percentile client elapsed time of successful INSERTs.
    - name: write_rows_per_second
      label: rows/s
      group: INSERT results
      description: Stored rows divided by the measured run duration, including request drain.
    - name: expected_rows
      label: expected rows
      group: INSERT results
      description: Acknowledged INSERT requests multiplied by rows per INSERT.
    - name: stored_rows
      label: stored rows
      group: INSERT results
      description: Rows verified in demo.events for this run ID.
    - name: read_completed
      label: completed
      group: SELECT results
      description: Completed SELECT requests.
    - name: read_rejected
      label: rejected
      group: SELECT results
      description: Requests rejected during admission with concurrency, workload overload or memory-reservation
        timeout errors.
    - name: read_failed
      label: failed
      group: SELECT results
      description: Other SELECT failures, including execution timeouts.
    - name: read_p95_ms
      label: p95 ms
      group: SELECT results
      description: 95th percentile client elapsed time of successful SELECTs.
    - name: peak_reads
      label: peak active
      group: SELECT results
      description: Maximum reader queries observed in 20 ms process-list samples.
    - name: peak_reserved_mib
      label: reserved MiB
      group: SELECT results
      description: Sampled maximum memory reserved by the reader workload. This includes reservation floors,
        not only actual query allocation.
    - name: peak_pending
      label: pending
      group: SELECT results
      description: Sampled maximum reader memory reservations waiting for admission.
    groups:
    - Run
    - Memory policy
    - SELECT workload
    - SELECT results
    - INSERT workload
    - INSERT results

  - name: protect-writes-memory-usage
    title: Server memory enforcement
    description: |-
      Limits the reader workload's tracked memory while INSERTs use a separate
      writer workload.

      The server assigns each user to its workload and fixes `reserve_memory` at
      zero. SELECTs build exact distinct sets that consume memory during execution.
      The workload's memory limit can terminate running queries.

      Compare budgets with the same traffic. Memory growth and query timing
      determine which SELECTs fail. The chart shows sampled memory and memory-limit
      failures.
    script: experiments/protect_memory_usage.py
    views:
    - type: time-series
      source: resource_history
      label: Memory usage
    - type: intervals
      source: requests
      label: Request timeline
      lanes:
        read: SELECT
        write: INSERT
      details:
        query_id: query_id
        Error code: error_code
        query_log event: server.event
        Server duration (ms): server.duration_ms
        Server memory (bytes): server.memory_bytes
        Error: error_name
        Workload: workload
        Reason: error
    parameters:
    - name: read_memory_mib
      label: SELECT memory limit (MiB)
      description: Server-enforced limit on tracked memory across reader workload queries. A value of 0
        disables this workload limit.
      short: budget MiB
      group: Memory policy
      default: 64
      choices:
      - 0
      - 16
      - 32
      - 64
      - 128
      - 256
    - name: read_rate
      label: SELECTs per second
      description: Number of SELECT requests scheduled each second. Every scheduled request is attempted
        once.
      short: req/s
      group: SELECT workload
      default: 8
      choices:
      - 4
      - 8
      - 16
    - name: read_shape
      label: SELECT timing
      description: Steady spaces SELECTs evenly through each second. Burst sends each second’s SELECTs together.
      short: arrivals
      group: SELECT workload
      default: burst
      choices:
      - steady
      - burst
    - name: read_rows
      label: Distinct values per SELECT
      description: Number of generated values added to an exact distinct set. Larger sets consume more query
        memory.
      short: values/query
      group: SELECT workload
      default: 1000000
      choices:
      - 100000
      - 500000
      - 1000000
      - 2000000
    - name: write_rate
      label: INSERTs per second
      description: Number of INSERT batches scheduled each second, evenly spaced.
      short: req/s
      group: INSERT workload
      default: 5
      choices:
      - 2
      - 5
      - 10
      - 20
    - name: batch_rows
      label: Rows per INSERT
      description: Number of rows written by each INSERT batch.
      short: rows/insert
      group: INSERT workload
      default: 1000
      choices:
      - 100
      - 1000
      - 10000
    - name: duration
      label: Traffic duration (s)
      description: Number of seconds to generate traffic. Requests still running at the end are allowed
        to finish before results are collected.
      short: duration
      group: Run
      default: 5
      choices:
      - 5
      - 10
      - 20
    results:
    - name: write_completed
      label: completed
      group: INSERT results
      description: Acknowledged INSERT requests.
    - name: write_rejected
      label: rejected
      group: INSERT results
      description: INSERT admission rejections. Request details identify the server error.
    - name: write_failed
      label: failed
      group: INSERT results
      description: Other INSERT failures, including transport failures.
    - name: write_p95_ms
      label: p95 ms
      group: INSERT results
      description: 95th percentile client elapsed time of successful INSERTs.
    - name: write_rows_per_second
      label: rows/s
      group: INSERT results
      description: Stored rows divided by the measured run duration, including request drain.
    - name: expected_rows
      label: expected rows
      group: INSERT results
      description: Acknowledged INSERT requests multiplied by rows per INSERT.
    - name: stored_rows
      label: stored rows
      group: INSERT results
      description: Rows verified in demo.events for this run ID.
    - name: read_completed
      label: completed
      group: SELECT results
      description: Completed SELECT requests.
    - name: read_resource_limited
      label: memory limited
      group: SELECT results
      description: SELECTs terminated with RESOURCE_LIMIT_EXCEEDED, MEMORY_RESERVATION_KILLED or MEMORY_RESERVATION_FAILED.
    - name: read_other_errors
      label: other errors
      group: SELECT results
      description: Other SELECT errors, including execution timeouts, transport failures and concurrency
        rejections.
    - name: read_p95_ms
      label: p95 ms
      group: SELECT results
      description: 95th percentile client elapsed time of successful SELECTs.
    - name: peak_reads
      label: peak active
      group: SELECT results
      description: Maximum reader queries observed in 20 ms process-list samples.
    - name: peak_reserved_mib
      label: peak MiB
      group: SELECT results
      description: Sampled maximum scheduler-accounted memory in the reader workload. Reservation floors
        are fixed at zero.
    groups:
    - Run
    - Memory policy
    - SELECT workload
    - SELECT results
    - INSERT workload
    - INSERT results
