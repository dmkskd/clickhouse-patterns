title: Resource limits & admission control
label: Limits
description: Configure resource limits and diagnose query failures in ClickHouse
icon: gauge
order: 8
notice: '**Experimental guide.** We are experimenting with the visual presentation. Coverage and examples are under development.'
intro: |-
  ClickHouse limits connections, concurrent queries, memory, CPU, IO and
  cumulative resource usage. Limits apply at the server, user, query, quota,
  workload or table level. Each setting determines the action when its limit
  is reached.

  - **Diagnose:** start from what happened to a query and its error code.
  - **Enforce:** start from what to limit, for whom, and what should happen
    at the limit.

related:
  - group: kafka-to-clickhouse
    note: For insert backpressure from streaming ingestion
