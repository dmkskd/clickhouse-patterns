title: Resource limits & admission control
label: Limits
description: Configure resource limits and diagnose query failures in ClickHouse
icon: gauge
order: 8
notice: 'Reference guide. Runtime examples are under development.'
intro: |-
  ClickHouse controls connections, query admission, CPU, memory, IO, query
  complexity and write backpressure. Quotas account for usage over an interval.
  Each mechanism defines an accounting scope, configuration and action.

  Diagnose filters by observed behavior and error code. Enforce filters by
  resource, accounting scope and action. Admission queues, execution pauses
  and deferred background work are shown separately.

related:
