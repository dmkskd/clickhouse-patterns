# Resource-limit decision guide. Sources are linked on each mechanism.
# Version annotations describe feature availability; defaults can vary by release.
versions: ['26.9', '26.10']
note: Reference guidance. The version filter excludes mechanisms introduced after the selected release.
  Individual settings and defaults can vary by release. Runtime examples are under development.
placements:
  - key: initiator
    label: Initiator node only
    note: The node the client connects to. It plans the query, sends a secondary query to each shard, and
      merges the results. Quotas are charged here only, including rows read on other shards.
  - key: every-node
    label: Every node, independently
    note: Each server enforces local query, memory, CPU and workload limits. Secondary queries use the
      executing user on that server. Keeper can share workload definitions; each host accounts for its
      own resources.
  - key: table-node
    label: Node that writes the parts
    note: "Insert backpressure and merge limits apply on the node that stores the table's parts: the shard
      receiving the rows of a Distributed insert."
  - key: buffer-node
    label: Distributed insert buffer node
    note: Background Distributed inserts first write a local sending queue. Queue backpressure applies on
      that node before rows reach the destination shard.
stages:
  - key: connection
    label: Connection
  - key: login
    label: Login
  - key: analysis
    label: Parsing and analysis
  - key: table-loading
    label: Table loading
    note: Startup only, with async_load_databases
  - key: workload
    label: Workload admission
    note: Only when a QUERY or MEMORY RESERVATION resource exists
  - key: process-list
    label: Process list
    note: Checked in this order; only the first can wait
  - key: start
    label: Start checks
  - key: execution
    label: Execution
    wide: true
  - key: writes
    label: Writes and background work
    wide: true
entries:
  - key: diagnose
    label: Diagnose
    view: pipeline
    prompt: Diagnosis by observed behavior and error code
    steps:
      - facet: behavior
        question: Observed behavior
        options:
          wait: Queue before execution
          pause: Pause during execution
          defer: Defer background work
          reject: Reject before execution
          kill: Fail during execution
          throttle: Throttle resource usage
          downscale: Reduce parallelism
          spill: Spill operator state
          break: Return a partial result
          omit-groups: Exclude new aggregation keys
          warn: Log a warning
      - facet: errors
        question: Error code
      - facet: configuration
        question: Configuration
        options:
          server: Server configuration
          profile: User or profile settings
          query: Query or session settings
          quota: Quota definition
          workload: Workload definition
          table: Table setting
      - facet: scope
        question: Scope
        options:
          server: Server
          user: User
          all-users: All users
          query: Query
          quota: Quota key and interval
          workload: Workload
          table: Table
          connection: Connection
  - key: enforce
    label: Enforce
    view: matrix
    prompt: Mechanisms by resource, accounting scope and behavior
    steps:
      - facet: resource
        question: Resource
        options:
          connections: Connections and sessions
          concurrency: Admission and query rate
          cpu: CPU scheduling
          memory: Memory and spilling
          io: IO rate and temporary storage
          execution: Query complexity and execution
          writes: Write backpressure
          usage: Usage over an interval
          access: Settings and workload policy
      - facet: scope
        question: Scope
        options:
          server: Server
          user: User
          all-users: All users
          query: Query
          quota: Quota key and interval
          workload: Workload
          table: Table
          connection: Connection
      - facet: behavior
        question: Behavior at the limit
        options:
          wait: Queue before execution
          pause: Pause during execution
          defer: Defer background work
          reject: Reject before execution
          kill: Fail during execution
          throttle: Throttle resource usage
          downscale: Reduce parallelism
          spill: Spill operator state
          break: Return a partial result
          omit-groups: Exclude new aggregation keys
          warn: Log a warning
      - facet: configuration
        question: Configuration
        options:
          server: Server configuration
          profile: User or profile settings
          query: Query or session settings
          quota: Quota definition
          workload: Workload definition
          table: Table setting
      - facet: activity
        question: Affected activity
        options:
          query: Queries
          background: Background merges and mutations
          connection: Connections and sessions
          policy: Settings policy
mechanisms:

  - id: max-connections
    title: Server connection limit
    stage: [connection]
    where: [every-node]
    facets:
      resource: [connections]
      scope: [server]
      behavior: [reject]
      configuration: [server]
      activity: [connection]
    settings: [max_connections]
    note: Sets the shared connection-handling thread-pool capacity, with a default of 4096. New
      connections can be refused when capacity is exhausted.
    docs: https://clickhouse.com/docs/operations/server-configuration-parameters/settings#max_connections
    observe: '`system.asynchronous_metrics` reports `TCPRejectedConnections` and `HTTPRejectedConnections`.
      Server logs identify thread-pool exhaustion or a full listener queue.'

  - id: cpu-overload-drop-connection
    title: Drop connections on CPU overload
    stage: [connection]
    where: [every-node]
    facets:
      resource: [connections, cpu]
      scope: [server]
      behavior: [reject]
      configuration: [server]
      activity: [connection]
    settings: [min_os_cpu_wait_time_ratio_to_drop_connection,
          max_os_cpu_wait_time_ratio_to_drop_connection]
    note: New connections are dropped with a probability derived from the OS CPU wait/busy ratio. The
      thresholds require available OS CPU wait and busy metrics.
    docs: https://clickhouse.com/docs/operations/settings/server-overload
    observe: The server’s `ProfileEvents` logger records the CPU wait/busy ratio and connection-drop
      probability when this check drops a connection.

  - id: tcp-connection-lifetime
    title: TCP connection query and time limits
    stage: [connection]
    where: [every-node]
    facets:
      resource: [connections]
      scope: [connection]
      behavior: [reject]
      configuration: [server]
      activity: [connection]
    errors: [TCP_CONNECTION_LIMIT_REACHED]
    settings: [tcp_close_connection_after_queries_num, tcp_close_connection_after_queries_seconds]
    note: Native TCP connections close on the next query after a query-count or duration threshold is
      reached. That query is rejected. Zero disables the corresponding threshold. These checks run at
      query boundaries.
    docs: https://clickhouse.com/docs/operations/settings/tcp-connection-limits
    observe: The native client receives `TCP_CONNECTION_LIMIT_REACHED` on the request that closes the
      connection.

  - id: sessions-per-user
    title: Sessions per user
    stage: [login]
    where: [every-node]
    facets:
      resource: [connections]
      scope: [user]
      behavior: [reject]
      configuration: [profile]
      activity: [connection]
    errors: [USER_SESSION_LIMIT_EXCEEDED]
    settings: [max_sessions_for_user]
    note: Caps authenticated sessions per user on the receiving server. The limit is read from the user’s
      profile. Native connections and HTTP named sessions have different session lifetimes.
    docs: https://clickhouse.com/docs/operations/settings/settings#max_sessions_for_user
    observe: The client receives `USER_SESSION_LIMIT_EXCEEDED`. `system.errors` aggregates this error’s
      count and most recent message on each server.

  - id: server-max-concurrent-queries
    title: Server concurrent query limit
    stage: [process-list]
    where: [every-node]
    facets:
      resource: [concurrency]
      scope: [server]
      behavior: [wait, reject]
      configuration: [server, profile, query]
      activity: [query]
    errors: [TOO_MANY_SIMULTANEOUS_QUERIES]
    settings: [max_concurrent_queries]
    note: The server-wide process-list check admits a queued query when a slot becomes free and rejects
      it when `queue_max_wait_ms` expires. A zero wait budget rejects immediately.
      `max_concurrent_queries` has a code default of 0 (unlimited); the shipped server configuration sets
      1000. Internal queries and selected administrative queries are exempt.
    pattern: server-concurrency-wait-vs-reject
    docs:
      https://clickhouse.com/docs/operations/server-configuration-parameters/settings#max_concurrent_queries
    observe: Match `query_id` in `system.query_log` to the client request. The log records errors and
      resource counters in `ProfileEvents`. `system.processes` lists running queries.
    setting_groups:
      Query settings: [queue_max_wait_ms]

  - id: server-per-kind-concurrency
    title: Server SELECT and INSERT concurrency limits
    stage: [process-list]
    where: [every-node]
    facets:
      resource: [concurrency]
      scope: [server]
      behavior: [reject]
      configuration: [server]
      activity: [query]
    errors: [TOO_MANY_SIMULTANEOUS_QUERIES]
    settings: [max_concurrent_select_queries, max_concurrent_insert_queries]
    note: The SELECT and INSERT checks reject immediately. A query can already have waited at the
      preceding server-wide process-list check.
    pattern: server-concurrency-wait-vs-reject
    docs:
      https://clickhouse.com/docs/operations/server-configuration-parameters/settings#max_concurrent_select_queries
    observe: Match `query_id` in `system.query_log` to the client request. The log records errors and
      resource counters in `ProfileEvents`. `system.processes` lists running queries.

  - id: user-concurrency
    title: Per-user query concurrency
    stage: [process-list]
    where: [every-node]
    facets:
      resource: [concurrency]
      scope: [user]
      behavior: [reject]
      configuration: [profile, query]
      activity: [query]
    errors: [TOO_MANY_SIMULTANEOUS_QUERIES]
    settings: [max_concurrent_queries_for_user]
    note: Counts the executing user’s non-internal queries on each server. This check rejects
      immediately; the preceding server-wide check can already have queued the query.
    pattern: server-concurrency-wait-vs-reject
    docs: https://clickhouse.com/docs/operations/settings/settings#max_concurrent_queries_for_user
    observe: Match `query_id` in `system.query_log` to the client request. The log records errors and
      resource counters in `ProfileEvents`. `system.processes` lists running queries.

  - id: async-load-waiting
    title: Queries waiting for tables to load at startup
    stage: [table-loading]
    where: [every-node]
    facets:
      resource: [concurrency]
      scope: [server]
      behavior: [wait, reject]
      configuration: [server]
      activity: [query]
    errors: [SERVER_OVERLOADED]
    settings: [max_waiting_queries, async_load_databases]
    since: '24.3'
    note: With `async_load_databases`, queries wait for required tables to load. The server
      `max_waiting_queries` bounds this startup queue. The process-list concurrency queue has its own
      wait budget.
    docs:
      https://clickhouse.com/docs/operations/server-configuration-parameters/settings#max_waiting_queries
    observe: Match `query_id` in `system.query_log` to the client request. The log records errors and
      resource counters in `ProfileEvents`. `system.processes` lists running queries.

  - id: workload-query-slots
    title: Workload query slots
    stage: [workload]
    where: [every-node]
    facets:
      resource: [concurrency]
      scope: [workload]
      behavior: [wait, reject]
      configuration: [workload, profile, query]
      activity: [query]
    errors: [SERVER_OVERLOADED, QUERY_SLOT_ACQUISITION_TIMEOUT]
    settings: [max_concurrent_queries, max_waiting_queries]
    since: '25.6'
    note: Requires a QUERY resource. Queries acquire a workload slot before the independent process-list
      checks. `max_waiting_queries` bounds a leaf workload’s queue. Waiting queries enter
      `system.processes` after admission. `workload_admission_timeout_ms` bounds the combined query-slot
      and memory-reservation wait from 26.9.
    docs: https://clickhouse.com/docs/operations/workload-scheduling#query_scheduling
    setting_groups:
      Query settings (26.9+): [workload_admission_timeout_ms]
    observe: '`system.scheduler` shows resource queues and allocations. Match `query_id` in `system.query_log`
      to the client request to inspect its outcome and error.'

  - id: workload-query-rate
    title: Workload query rate
    stage: [workload]
    where: [every-node]
    facets:
      resource: [concurrency]
      scope: [workload]
      behavior: [wait, reject]
      configuration: [workload, profile, query]
      activity: [query]
    settings: [max_queries_per_second, max_burst_queries, max_waiting_queries]
    since: '25.6'
    note: Requires a QUERY resource. A token bucket admits new queries within the rate and burst
      budget. A full leaf-workload queue rejects arrivals. From 26.9, `workload_admission_timeout_ms`
      bounds admission waiting; 0 permits an unbounded wait.
    errors: [SERVER_OVERLOADED, QUERY_SLOT_ACQUISITION_TIMEOUT]
    setting_groups:
      Query settings (26.9+): [workload_admission_timeout_ms]
    docs: https://clickhouse.com/docs/operations/workload-scheduling
    observe: '`system.scheduler` shows resource queues and allocations. Match `query_id` in `system.query_log`
      to the client request to inspect its outcome and error.'

  - id: all-users-concurrency
    title: All-users query concurrency
    stage: [process-list]
    where: [every-node]
    facets:
      resource: [concurrency]
      scope: [all-users]
      behavior: [reject]
      configuration: [profile, query]
      activity: [query]
    settings: [max_concurrent_queries_for_all_users]
    errors: [TOO_MANY_SIMULTANEOUS_QUERIES]
    note: Compares the server’s non-internal query count with the threshold in the incoming query’s
      settings. Profiles can assign different thresholds to different users.
    pattern: server-concurrency-wait-vs-reject
    docs: https://clickhouse.com/docs/operations/settings/settings#max_concurrent_queries_for_all_users
    observe: Match `query_id` in `system.query_log` to the client request. The log records errors and
      resource counters in `ProfileEvents`. `system.processes` lists running queries.

  - id: cpu-overload-reject
    title: Reject queries on CPU overload
    stage: [start]
    where: [every-node]
    facets:
      resource: [cpu]
      scope: [server]
      behavior: [reject]
      configuration: [profile, query]
      activity: [query]
    errors: [SERVER_OVERLOADED]
    settings: [min_os_cpu_wait_time_ratio_to_throw, max_os_cpu_wait_time_ratio_to_throw]
    since: '25.4'
    note: Query admission rejects with a probability derived from OS CPU wait/busy metrics and the
      configured thresholds.
    docs: https://clickhouse.com/docs/operations/settings/server-overload
    observe: Match `query_id` in `system.query_log` to the client request. The log records errors and
      resource counters in `ProfileEvents`. `system.processes` lists running queries.

  - id: concurrency-control
    title: Server CPU slots
    stage: [execution]
    where: [every-node]
    facets:
      resource: [cpu]
      scope: [server]
      behavior: [downscale]
      configuration: [server, profile, query]
      activity: [query]
    settings: [concurrent_threads_soft_limit_num, concurrent_threads_soft_limit_ratio_to_cores,
          concurrent_threads_scheduler]
    note: Soft CPU-slot scheduling limits worker parallelism. Each query retains a first thread.
      `use_concurrency_control` enables participation. A CPU workload resource selects workload
      scheduling. Scheduler defaults vary by release; `max_min_fair` is the default from 26.2.
    setting_groups:
      Query settings: [use_concurrency_control]
    docs:
      https://clickhouse.com/docs/operations/server-configuration-parameters/settings#concurrent_threads_soft_limit_num
    observe: Match `query_id` in `system.query_log` to the client request. The log records errors and
      resource counters in `ProfileEvents`. `system.processes` lists running queries.

  - id: query-threads
    title: Read-side parallelism
    stage: [execution]
    where: [every-node]
    facets:
      resource: [cpu]
      scope: [query]
      behavior: [downscale]
      configuration: [profile, query]
      activity: [query]
    settings: [max_threads, max_threads_min_free_memory_per_thread]
    note: '`max_threads` caps read-side parallelism. From 26.5, `max_threads_min_free_memory_per_thread` lowers
      it under tracked server-memory pressure; 0 disables that reduction. Insert-side parallelism uses `max_insert_threads`.'
    docs: https://clickhouse.com/docs/operations/settings/settings#max_threads
    observe: Match `query_id` in `system.query_log` to the client request. The log records errors and
      resource counters in `ProfileEvents`. `system.processes` lists running queries.

  - id: query-priority
    title: Query priority
    stage: [execution]
    where: [every-node]
    facets:
      resource: [cpu]
      scope: [query]
      behavior: [pause]
      configuration: [profile, query]
      activity: [query]
    settings: [priority, low_priority_query_wait_time_ms]
    note: At progress checks, lower-priority queries can pause while higher-priority queries
      execute. `low_priority_query_wait_time_ms` bounds an individual `priority` wait. Workload
      `priority` belongs to a separate scheduler.
    docs: https://clickhouse.com/docs/operations/settings/settings#priority
    observe: Match `query_id` in `system.query_log` to the client request. The log records errors and
      resource counters in `ProfileEvents`. `system.processes` lists running queries.

  - id: workload-cpu-slots
    title: Workload CPU slots
    stage: [execution, writes]
    where: [every-node]
    facets:
      resource: [cpu]
      scope: [workload]
      behavior: [pause, downscale]
      configuration: [workload, server]
      activity: [query, background]
    settings: [max_concurrent_threads, max_concurrent_threads_ratio_to_cores, priority, weight]
    since: '25.4'
    note: Requires a CPU resource for MASTER THREAD, WORKER THREAD or both. Threads wait for CPU slots.
      With `cpu_slot_preemption` enabled, worker threads can exit after `cpu_slot_preemption_timeout_ms`
      and reduce query parallelism. Master threads can continue waiting.
    docs: https://clickhouse.com/docs/operations/workload-scheduling#cpu_scheduling
    setting_groups:
      Server settings: [cpu_slot_preemption, cpu_slot_preemption_timeout_ms]
    observe: '`system.scheduler` shows resource queues and allocations. Match `query_id` in `system.query_log`
      to the client request to inspect its outcome and error.'

  - id: workload-cpu-throttle
    title: Workload CPU throttling
    stage: [execution, writes]
    where: [every-node]
    facets:
      resource: [cpu]
      scope: [workload]
      behavior: [throttle]
      configuration: [workload]
      activity: [query, background]
    settings: [max_cpus, max_cpu_share, max_burst_cpu_seconds]
    since: '25.8'
    note: A token bucket accounts CPU seconds. Requires a CPU resource and `cpu_slot_preemption`.
      `max_cpus` sets an absolute CPU-time rate; `max_cpu_share` expresses a share of CPU capacity.
    docs: https://clickhouse.com/docs/operations/workload-scheduling
    observe: '`system.scheduler` shows resource queues and allocations. Match `query_id` in `system.query_log`
      to the client request to inspect its outcome and error.'

  - id: query-auto-threads
    title: Automatic parallelism from CPU fair share
    stage: [execution]
    where: [every-node]
    facets:
      resource: [cpu]
      scope: [query]
      behavior: [downscale]
      configuration: [profile, query]
      activity: [query]
    settings: [max_threads, use_concurrency_control, use_concurrency_control_for_max_threads]
    since: '26.10'
    note: With `max_threads`=`auto` and concurrency control enabled, the planner chooses parallelism from
      the current fair share of server CPU slots.
    docs: https://clickhouse.com/docs/operations/settings/settings#max_threads
    observe: Match `query_id` in `system.query_log` to the client request. The log records errors and
      resource counters in `ProfileEvents`. `system.processes` lists running queries.

  - id: insert-threads
    title: Insert-side parallelism
    stage: [writes]
    where: [every-node]
    facets:
      resource: [cpu, writes]
      scope: [query]
      behavior: [downscale]
      configuration: [profile, query]
      activity: [query]
    settings: [max_insert_threads, max_insert_threads_min_free_memory_per_thread]
    note: '`max_insert_threads` caps parallel insert pipelines where supported. From 26.5, the free-memory
      setting can reduce this parallelism; 0 disables the memory-based reduction.'
    docs: https://clickhouse.com/docs/operations/settings/settings#max_insert_threads
    observe: Match `query_id` in `system.query_log` to the client request. The log records errors and
      resource counters in `ProfileEvents`. `system.processes` lists running queries.

  - id: server-memory
    title: Server memory limit
    stage: [login, execution]
    where: [every-node]
    facets:
      resource: [memory]
      scope: [server]
      behavior: [reject, kill]
      configuration: [server]
      activity: [query]
    errors: [MEMORY_LIMIT_EXCEEDED]
    settings: [max_server_memory_usage, max_server_memory_usage_to_ram_ratio]
    note: Limits tracked server memory. An allocation can fail or invoke overcommit victim selection.
      Admission checks can also reject requests under memory pressure.
      `max_server_memory_usage_to_ram_ratio` caps the limit relative to available memory; runtime
      adjustment depends on release and memory-worker settings.
    docs:
      https://clickhouse.com/docs/operations/server-configuration-parameters/settings#max_server_memory_usage
    observe: '`system.query_log` records errors, `memory_usage` and resource counters in `ProfileEvents`.
      `system.query_metric_log` supplies sampled memory history when enabled.'

  - id: user-memory
    title: Per-user memory limit
    stage: [execution]
    where: [every-node]
    facets:
      resource: [memory]
      scope: [user]
      behavior: [kill]
      configuration: [profile, query]
      activity: [query]
    errors: [MEMORY_LIMIT_EXCEEDED]
    settings: [max_memory_usage_for_user]
    note: Limits the executing user’s tracked query memory on each server. Overcommit can select a victim
      when enabled. A zero limit permits unrestricted user-level accounting; server and query limits
      still apply.
    docs: https://clickhouse.com/docs/operations/settings/query-complexity
    observe: '`system.query_log` records errors, `memory_usage` and resource counters in `ProfileEvents`.
      `system.query_metric_log` supplies sampled memory history when enabled.'

  - id: query-memory
    title: Per-query memory limit
    stage: [execution]
    where: [every-node]
    facets:
      resource: [memory]
      scope: [query]
      behavior: [kill]
      configuration: [profile, query]
      activity: [query]
    errors: [MEMORY_LIMIT_EXCEEDED]
    settings: [max_memory_usage]
    note: Limits tracked memory for one query on each server. A zero value disables this query-level
      limit. Server and user limits still apply. Tracked allocations cover part of process resident
      memory.
    docs: https://clickhouse.com/docs/operations/settings/query-complexity
    observe: '`system.query_log` records errors, `memory_usage` and resource counters in `ProfileEvents`.
      `system.query_metric_log` supplies sampled memory history when enabled.'

  - id: memory-overcommit
    title: Memory overcommit
    stage: [execution]
    where: [every-node]
    facets:
      resource: [memory]
      scope: [server, user]
      behavior: [pause, kill]
      configuration: [server, profile, query]
      activity: [query]
    errors: [MEMORY_LIMIT_EXCEEDED]
    settings: [memory_overcommit_ratio_denominator, memory_overcommit_ratio_denominator_for_user,
          memory_usage_overcommit_max_wait_microseconds]
    note: At a server or user memory limit, an allocation can wait while the tracker selects the query
      with the largest allocated-bytes/denominator ratio. A zero denominator excludes a query from victim
      selection. The wait budget is configurable (default 5 seconds); insufficient released memory can
      fail the requester.
    docs: https://clickhouse.com/docs/operations/settings/memory-overcommit
    observe: '`system.query_log` records errors, `memory_usage` and resource counters in `ProfileEvents`.
      `system.query_metric_log` supplies sampled memory history when enabled.'
    setting_groups:
      Server settings (global tracker wait): [memory_usage_overcommit_max_wait_microseconds]

  - id: merges-memory
    title: Merge and mutation memory soft limit
    stage: [writes]
    where: [table-node]
    facets:
      resource: [memory]
      scope: [server]
      behavior: [defer]
      configuration: [server]
      activity: [background]
    settings: [merges_mutations_memory_usage_soft_limit, merges_mutations_memory_usage_to_ram_ratio]
    note: A soft tracked-memory limit defers scheduling new background merges and mutations. Already
      scheduled tasks continue. The ratio supplies a RAM-based default when an explicit limit is unset.
    docs:
      https://clickhouse.com/docs/operations/server-configuration-parameters/settings#merges_mutations_memory_usage_soft_limit
    observe: '`system.merges` and `system.part_log` show background work; `system.metrics` and `system.events`
      show server counters.'

  - id: workload-memory
    title: Workload memory reservation
    stage: [workload, execution]
    where: [every-node]
    facets:
      resource: [memory]
      scope: [workload]
      behavior: [wait, reject, kill]
      configuration: [workload, profile, query]
      activity: [query]
    errors: [SERVER_OVERLOADED, MEMORY_RESERVATION_ACQUISITION_TIMEOUT, MEMORY_RESERVATION_KILLED,
          MEMORY_RESERVATION_FAILED]
    settings: [max_memory, precedence, weight, max_waiting_queries]
    since: '26.6'
    note: Experimental; requires a MEMORY RESERVATION resource. Queries with `reserve_memory`>0 can queue
      for admission. Lower numeric `precedence` is served first. Running allocations with equal
      `precedence` can also evict each other according to memory usage divided by `weight`. Eviction
      takes effect at memory synchronization points.
    docs: https://clickhouse.com/docs/operations/workload-scheduling#memory-reservations
    setting_groups:
      Query settings: [reserve_memory]
      Query settings (26.9+): [workload_admission_timeout_ms]
    observe: '`system.scheduler` shows resource queues and allocations. Match `query_id` in `system.query_log`
      to the client request to inspect its outcome and error.'

  - id: workload-spill
