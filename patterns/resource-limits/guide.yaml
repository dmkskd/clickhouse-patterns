# Decision guide for the resource-limits group. Every mechanism is one record;
# the entry points are orders of facet filters over the same records.
# Sources: ClickHouse 26.10 source and docs, changelogs 24.1 to 26.10.

# Where a limit is enforced when a query runs on a cluster.
placements:
  - key: initiator
    label: Initiator node only
    note: >-
      The node the client connects to. It plans the query, sends a secondary
      query to each shard, and merges the results. Quotas are charged here
      only, including rows read on other shards.
  - key: every-node
    label: Every node, independently
    note: >-
      Each node checks its own limits for the part of the query it runs. A
      secondary query takes a process-list slot on its shard, and memory, CPU,
      and complexity limits apply per server. Workload definitions can be
      shared through Keeper, but their limits are enforced per host.
  - key: table-node
    label: Node that writes the parts
    note: >-
      Insert backpressure and merge limits apply on the node that stores the
      table's parts: the shard receiving the rows of a Distributed insert.

stages:
  - key: connection
    label: Connection
  - key: login
    label: Login
  - key: table-loading
    label: Table loading
    note: Startup only, with async_load_databases
  - key: workload
    label: Workload admission
    note: Only when a QUERY or MEMORY RESERVATION resource exists
  - key: process-list
    label: Process list
    note: Checked in this order; only the first can wait
  - key: start
    label: Start checks
  - key: execution
    label: Execution
    wide: true
  - key: writes
    label: Inserts and merges
    wide: true

entries:
  - key: diagnose
    label: Diagnose
    view: pipeline
    prompt: Why did a query wait, fail, or slow down?
    steps:
      - facet: behavior
        question: What happened to the query?
        options:
          reject: Rejected before it ran
          wait: Waited, then ran
          kill: Failed while running
          throttle: Ran slower than expected
          downscale: Ran with fewer threads
          break: Returned a partial result
          spill: Spilled to disk
      - facet: errors
        question: Which error code?
      - facet: scope
        question: Where can the limit be set?
        options: &scopes
          server: Server config
          user: User or settings profile
          query: Query setting
          quota: Quota
          workload: Workload
          table: Table setting

  - key: enforce
    label: Enforce
    view: matrix
    prompt: Which mechanism gives the behavior I want?
    steps:
      - facet: resource
        question: What should be limited?
        options:
          concurrency: Concurrent queries
          connections: Connections and sessions
          cpu: CPU
          memory: Memory
          io: Disk and network IO
          execution: Run time and rows
          usage: Usage over a time interval
          writes: Inserts and mutations
          access: Settings and workload access
      - facet: scope
        question: For whom?
        options: *scopes
      - facet: behavior
        question: What should happen at the limit?
        options:
          wait: Queue the query
          reject: Reject the query
          throttle: Slow it down
          downscale: Use fewer threads
          spill: Spill to disk
          break: Return a partial result
          kill: Stop the query

mechanisms:
  # Concurrency
  - id: server-max-concurrent-queries
    title: Server concurrent query limit
    stage: [process-list]
    where: [every-node]
    facets: { resource: [concurrency], scope: [server], behavior: [wait, reject] }
    errors: [TOO_MANY_SIMULTANEOUS_QUERIES]
    settings: [max_concurrent_queries, queue_max_wait_ms]
    note: >-
      Waits up to queue_max_wait_ms, then rejects. Rejects at once when
      queue_max_wait_ms is 0 (the default). Code default 0, shipped config.xml
      sets 1000. Counts non-internal queries only.
    pattern: server-concurrency-wait-vs-reject
    docs: https://clickhouse.com/docs/operations/server-configuration-parameters/settings#max_concurrent_queries

  - id: server-per-kind-concurrency
    title: Server SELECT and INSERT concurrency limits
    stage: [process-list]
    where: [every-node]
    facets: { resource: [concurrency], scope: [server], behavior: [reject] }
    errors: [TOO_MANY_SIMULTANEOUS_QUERIES]
    settings: [max_concurrent_select_queries, max_concurrent_insert_queries]
    note: Rejects at once. queue_max_wait_ms does not apply.
    pattern: server-concurrency-wait-vs-reject

  - id: user-concurrency
    title: Per-user and all-users concurrency limits
    stage: [process-list]
    where: [every-node]
    facets: { resource: [concurrency], scope: [user], behavior: [reject] }
    errors: [TOO_MANY_SIMULTANEOUS_QUERIES]
    settings: [max_concurrent_queries_for_user, max_concurrent_queries_for_all_users]
    note: >-
      Rejects at once. queue_max_wait_ms does not apply. Cloud default for
      max_concurrent_queries_for_all_users is 1000.
    pattern: server-concurrency-wait-vs-reject

  - id: async-load-waiting
    title: Queries waiting for tables to load at startup
    stage: [table-loading]
    where: [every-node]
    facets: { resource: [concurrency], scope: [server], behavior: [wait, reject] }
    errors: [SERVER_OVERLOADED]
    settings: [max_waiting_queries, async_load_databases]
    since: "24.3"
    note: >-
      A query that needs a table still loading waits. max_waiting_queries caps
      how many wait. It does not apply to the max_concurrent_queries queue.

  - id: workload-query-slots
    title: Workload query slots
    stage: [workload]
    where: [every-node]
    facets: { resource: [concurrency], scope: [workload], behavior: [wait, reject] }
    errors: [SERVER_OVERLOADED, QUERY_SLOT_ACQUISITION_TIMEOUT]
    settings: [max_concurrent_queries, max_waiting_queries, workload_admission_timeout_ms]
    since: "25.6"
    note: >-
      Needs CREATE RESOURCE ... (QUERY). Queries wait for a slot; workload
      max_waiting_queries (25.7) rejects when the queue is full;
      workload_admission_timeout_ms (26.9) bounds the wait. Waiting queries are
      not in system.processes.
    docs: https://clickhouse.com/docs/operations/workload-scheduling#query_scheduling

  - id: workload-query-rate
    title: Workload query rate
    stage: [workload]
    where: [every-node]
    facets: { resource: [concurrency], scope: [workload], behavior: [wait] }
    settings: [max_queries_per_second, max_burst_queries]
    since: "25.6"
    note: Token bucket. New queries wait until the budget allows them to start.

  # Connections and sessions
  - id: max-connections
    title: Server connection limit
    stage: [connection]
    where: [every-node]
    facets: { resource: [connections], scope: [server], behavior: [reject] }
    settings: [max_connections]
    note: Refuses new connections. Default 4096.

  - id: cpu-overload-drop-connection
    title: Drop connections on CPU overload
    stage: [connection]
    where: [every-node]
    facets: { resource: [connections], scope: [server], behavior: [reject] }
    settings: [min_os_cpu_wait_time_ratio_to_drop_connection, max_os_cpu_wait_time_ratio_to_drop_connection]
    note: Drops a new connection with a probability that grows with the CPU wait/busy ratio.
    docs: https://clickhouse.com/docs/operations/settings/server-overload

  - id: tcp-connection-lifetime
    title: TCP connection query and time limits
    stage: [connection]
    where: [initiator]
    facets: { resource: [connections], scope: [server], behavior: [reject] }
    errors: [TCP_CONNECTION_LIMIT_REACHED]
    settings: [tcp_close_connection_after_queries_num, tcp_close_connection_after_queries_seconds]
    note: Closes the connection. The query that triggered it does not run.
    docs: https://clickhouse.com/docs/operations/settings/tcp-connection-limits

  - id: sessions-per-user
    title: Sessions per user
    stage: [login]
    where: [initiator]
    facets: { resource: [connections], scope: [user], behavior: [reject] }
    errors: [USER_SESSION_LIMIT_EXCEEDED]
    settings: [max_sessions_for_user]
    note: Settable in a settings profile only.

  # CPU
  - id: cpu-overload-reject
    title: Reject queries on CPU overload
    stage: [start]
    where: [every-node]
    facets: { resource: [cpu], scope: [query], behavior: [reject] }
    errors: [SERVER_OVERLOADED]
    settings: [min_os_cpu_wait_time_ratio_to_throw, max_os_cpu_wait_time_ratio_to_throw]
    since: "25.4"
    note: Rejects with a probability interpolated from the CPU wait/busy ratio.
    docs: https://clickhouse.com/docs/operations/settings/server-overload

  - id: concurrency-control
    title: Server CPU slots
    stage: [execution]
    where: [every-node]
    facets: { resource: [cpu], scope: [server], behavior: [downscale] }
    settings: [concurrent_threads_soft_limit_num, concurrent_threads_soft_limit_ratio_to_cores, concurrent_threads_scheduler]
    note: >-
      Each query gets at least one thread and more as slots free. Scheduler
      default max_min_fair since 26.2. Ignored once a CPU workload resource
      exists.

  - id: query-threads
    title: Query thread caps
    stage: [execution]
    where: [every-node]
    facets: { resource: [cpu], scope: [query], behavior: [downscale] }
    settings: [max_threads, max_threads_min_free_memory_per_thread, use_concurrency_control_for_max_threads]
    note: >-
      max_threads caps parallelism. Since 26.5 it is lowered under server
      memory pressure; since 26.10 an unset max_threads follows the fair share
      of CPU slots.

  - id: query-priority
    title: Query priority
    stage: [execution]
    where: [every-node]
    facets: { resource: [cpu], scope: [query], behavior: [wait] }
    settings: [priority, low_priority_query_wait_time_ms]
    note: >-
      Lower-priority queries pause while higher-priority ones run. Unrelated to
      the workload priority setting.

  - id: workload-cpu-slots
    title: Workload CPU slots
    stage: [execution]
    where: [every-node]
    facets: { resource: [cpu], scope: [workload], behavior: [wait, downscale] }
    settings: [max_concurrent_threads, max_concurrent_threads_ratio_to_cores, priority, weight]
    since: "25.4"
    note: >-
      Needs CREATE RESOURCE cpu (MASTER THREAD, WORKER THREAD). Threads wait for
      slots; preemption (default since 26.1) scales queries down.
    docs: https://clickhouse.com/docs/operations/workload-scheduling#cpu_scheduling

  - id: workload-cpu-throttle
    title: Workload CPU throttling
    stage: [execution]
    where: [every-node]
    facets: { resource: [cpu], scope: [workload], behavior: [throttle] }
    settings: [max_cpus, max_cpu_share, max_burst_cpu_seconds]
    since: "25.8"
    note: Token bucket on CPU time. Requires cpu_slot_preemption.

  # Memory
  - id: server-memory
    title: Server memory limit
    stage: [login, execution]
    where: [every-node]
    facets: { resource: [memory], scope: [server], behavior: [reject, kill] }
    errors: [MEMORY_LIMIT_EXCEEDED]
    settings: [max_server_memory_usage, max_server_memory_usage_to_ram_ratio]
    note: >-
      Kills the allocating query. Since 26.2 a query is rejected before
      authentication when memory is already over the limit. Since 26.6 the
      ratio follows available host or cgroup memory.

  - id: user-memory
    title: Per-user memory limit
    stage: [execution]
    where: [every-node]
    facets: { resource: [memory], scope: [user], behavior: [kill] }
    errors: [MEMORY_LIMIT_EXCEEDED]
    settings: [max_memory_usage_for_user]

  - id: query-memory
    title: Per-query memory limit
    stage: [execution]
    where: [every-node]
    facets: { resource: [memory], scope: [query], behavior: [kill] }
    errors: [MEMORY_LIMIT_EXCEEDED]
    settings: [max_memory_usage]

  - id: memory-overcommit
    title: Memory overcommit
    stage: [execution]
    where: [every-node]
    facets: { resource: [memory], scope: [query], behavior: [wait, kill] }
    errors: [MEMORY_LIMIT_EXCEEDED]
    settings: [memory_overcommit_ratio_denominator, memory_overcommit_ratio_denominator_for_user, memory_usage_overcommit_max_wait_microseconds]
    note: >-
      At the server or user limit, an allocation waits up to 5 s while the
      most overcommitted query is killed.
    docs: https://clickhouse.com/docs/operations/settings/memory-overcommit

  - id: query-spill
    title: External aggregation, sort, join, DISTINCT, and IN sets
    stage: [execution]
    where: [every-node]
    facets: { resource: [memory], scope: [query], behavior: [spill] }
    settings: [max_bytes_ratio_before_external_group_by, max_bytes_ratio_before_external_sort, max_bytes_before_external_join, max_bytes_ratio_before_external_distinct, max_bytes_ratio_before_external_set]
    note: Moves operator state to disk before the memory limit. DISTINCT since 26.9, IN sets by default since 26.10.

  - id: merges-memory
    title: Merge and mutation memory soft limit
    stage: [writes]
    where: [table-node]
    facets: { resource: [memory], scope: [server], behavior: [wait] }
    settings: [merges_mutations_memory_usage_soft_limit, merges_mutations_memory_usage_to_ram_ratio]
    note: New background merges and mutations are not scheduled; running ones continue.

  - id: workload-memory
    title: Workload memory reservation
    stage: [workload, execution]
    where: [every-node]
    facets: { resource: [memory], scope: [workload], behavior: [wait, reject, kill] }
    errors: [SERVER_OVERLOADED, MEMORY_RESERVATION_ACQUISITION_TIMEOUT]
    settings: [max_memory, precedence, reserve_memory, max_waiting_queries]
    since: "26.6"
    note: >-
      Experimental. Needs CREATE RESOURCE memory (MEMORY RESERVATION). A query
      with reserve_memory waits for its reservation; a higher-precedence
      workload evicts (kills) lower-precedence queries.
    docs: https://clickhouse.com/docs/operations/workload-scheduling#memory-reservations

  - id: workload-spill
    title: Workload spill threshold
    stage: [execution]
    where: [every-node]
    facets: { resource: [memory], scope: [workload], behavior: [spill] }
    settings: [max_memory_before_spill, max_memory_to_spill_ratio]
    since: "26.10"
    note: Experimental soft limit below max_memory.

  # Disk and network IO
  - id: server-bandwidth
    title: Server bandwidth limits
    stage: [execution]
    where: [every-node]
    facets: { resource: [io], scope: [server], behavior: [throttle] }
    settings: [max_remote_read_network_bandwidth_for_server, max_local_read_bandwidth_for_server, max_merges_bandwidth_for_server, max_mutations_bandwidth_for_server]

  - id: user-bandwidth
    title: Per-user network bandwidth
    stage: [execution]
    where: [every-node]
    facets: { resource: [io], scope: [user], behavior: [throttle] }
    settings: [max_network_bandwidth_for_user, max_network_bandwidth_for_all_users]
    note: Also applies to remote filesystem IO since 26.5.

  - id: query-bandwidth
    title: Per-query bandwidth limits
    stage: [execution]
    where: [every-node]
    facets: { resource: [io], scope: [query], behavior: [throttle] }
    settings: [max_network_bandwidth, max_remote_read_network_bandwidth, max_local_read_bandwidth]

  - id: workload-io
    title: Workload IO scheduling
    stage: [execution]
    where: [every-node]
    facets: { resource: [io], scope: [workload], behavior: [wait, throttle] }
    settings: [max_io_requests, max_bytes_inflight, max_bytes_per_second, max_burst_bytes]
    since: "24.11"
    note: Needs CREATE RESOURCE ... (READ DISK d, WRITE DISK d). Also used by merges and mutations via merge_workload.
    docs: https://clickhouse.com/docs/operations/workload-scheduling

  # Run time and rows
  - id: execution-time
    title: Query run time and speed
    stage: [execution]
    where: [every-node]
    facets: { resource: [execution], scope: [query], behavior: [kill, break] }
    errors: [TIMEOUT_EXCEEDED, TOO_SLOW]
    settings: [max_execution_time, max_estimated_execution_time, min_execution_speed, timeout_overflow_mode]
    note: timeout_overflow_mode = 'break' returns a partial result where the operation allows it.
    docs: https://clickhouse.com/docs/operations/settings/query-complexity

  - id: execution-rows
    title: Rows and bytes read or returned
    stage: [execution]
    where: [every-node]
    facets: { resource: [execution], scope: [query], behavior: [kill, break] }
    errors: [TOO_MANY_ROWS, TOO_MANY_ROWS_OR_BYTES]
    settings: [max_rows_to_read, max_bytes_to_read, max_result_rows, max_rows_to_group_by, read_overflow_mode, result_overflow_mode]
    note: Each limit has an *_overflow_mode of throw or break.
    docs: https://clickhouse.com/docs/operations/settings/query-complexity

  - id: execution-speed-cap
    title: Maximum execution speed
    stage: [execution]
    where: [every-node]
    facets: { resource: [execution], scope: [query], behavior: [throttle] }
    settings: [max_execution_speed, max_execution_speed_bytes]

  # Usage over a time interval
  - id: quotas
    title: Quotas
    stage: [start, execution]
    where: [initiator]
    facets: { resource: [usage], scope: [quota], behavior: [reject, kill] }
    errors: [QUOTA_EXCEEDED]
    settings: [queries, errors, read_rows, result_rows, written_rows, execution_time, queries_per_normalized_hash]
    note: >-
      Rejects until the interval resets; read_rows can stop a running query.
      Counted per server, charged on the initiator, reset on restart. Before
      26.6 only one of several assigned quotas was enforced.
    docs: https://clickhouse.com/docs/operations/quotas

  # Inserts and mutations
  - id: parts-backpressure
    title: Too many parts
    stage: [writes]
    where: [table-node]
    facets: { resource: [writes], scope: [table], behavior: [throttle, reject] }
    errors: [TOO_MANY_PARTS]
    settings: [parts_to_delay_insert, parts_to_throw_insert, max_parts_in_total, max_delay_to_insert]
    note: Inserts are delayed above 1000 active parts per partition and rejected above 3000.

  - id: partitions-per-insert
    title: Partitions per inserted block
    stage: [writes]
    where: [table-node]
    facets: { resource: [writes], scope: [query], behavior: [reject] }
    errors: [TOO_MANY_PARTS]
    settings: [max_partitions_per_insert_block, throw_on_max_partitions_per_insert_block]

  - id: mutations-backpressure
    title: Too many mutations
    stage: [writes]
    where: [table-node]
    facets: { resource: [writes], scope: [table], behavior: [throttle, reject] }
    errors: [TOO_MANY_MUTATIONS]
    settings: [number_of_mutations_to_delay, number_of_mutations_to_throw]

  # Settings and workload access
  - id: settings-constraints
    title: Settings constraints
    stage: [start]
    where: [initiator]
    facets: { resource: [access], scope: [user], behavior: [reject] }
    errors: [SETTING_CONSTRAINT_VIOLATION]
    settings: [min, max, disallowed, const, changeable_in_readonly]
    note: Stops a user from raising the limits set in a settings profile.
    docs: https://clickhouse.com/docs/operations/settings/constraints-on-settings

  - id: unknown-workload
    title: Unknown workload
    stage: [workload]
    where: [every-node]
    facets: { resource: [access], scope: [server], behavior: [reject] }
    errors: [RESOURCE_ACCESS_DENIED]
    settings: [throw_on_unknown_workload]
    since: "25.2"
    note: With false (the default), a query naming an unknown workload bypasses scheduling.

gaps:
  - when: { resource: concurrency, scope: user, behavior: wait }
    note: >-
      Per-user concurrency limits reject without waiting. To queue a user's
      queries, fix the user's workload in a settings profile and limit that
      workload's query slots.
    see: [workload-query-slots, user-concurrency]
  - when: { resource: concurrency, scope: query, behavior: wait }
    note: >-
      No query setting queues on concurrency. queue_max_wait_ms only sets how
      long the server-wide max_concurrent_queries queue holds a query.
    see: [server-max-concurrent-queries]
  - when: { resource: memory, scope: server, behavior: wait }
    note: >-
      The server memory limit kills or rejects queries. Queueing on memory needs
      a workload memory reservation.
    see: [workload-memory, memory-overcommit]
  - when: { resource: cpu, scope: user }
    note: There is no per-user CPU limit. Assign the user a workload with CPU limits.
    see: [workload-cpu-slots, workload-cpu-throttle]
  - when: { resource: usage, behavior: wait }
    note: Quotas reject until the interval resets; they never queue.
    see: [quotas]
