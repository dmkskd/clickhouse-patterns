    docs: https://clickhouse.com/docs/operations/settings/query-complexity
    observe: Client errors and server logs report parsing or analysis failures. `system.query_log` can
      record the failed request with its `query_id` and `exception_code`.

  - id: column-count
    title: Read and intermediate column counts
    stage: [analysis, execution]
    where: [every-node]
    facets:
      resource: [execution, memory]
      scope: [query]
      behavior: [reject, kill]
      configuration: [profile, query]
      activity: [query]
    settings: [max_columns_to_read, max_temporary_columns, max_temporary_non_const_columns]
    errors: [TOO_MANY_COLUMNS, TOO_MANY_TEMPORARY_COLUMNS, TOO_MANY_TEMPORARY_NON_CONST_COLUMNS]
    note: Bounds read columns and simultaneous intermediate columns. Zero disables the corresponding
      count limit. Checks apply during query preparation and processing.
    docs: https://clickhouse.com/docs/operations/settings/query-complexity
    observe: Match `query_id` in `system.query_log` to the client request. The log records errors and
      resource counters in `ProfileEvents`. `system.processes` lists running queries.

  - id: partitions-read
    title: Partitions read
    stage: [start]
    where: [every-node]
    facets:
      resource: [execution]
      scope: [query]
      behavior: [reject]
      configuration: [table, profile, query]
      activity: [query]
    settings: [max_partitions_to_read]
    errors: [TOO_MANY_PARTITIONS]
    note: Bounds partitions selected by a query. The query setting overrides a table default. A value of
      -1 disables the cap.
    setting_groups:
      Table settings: [max_partitions_to_read]
    docs: https://clickhouse.com/docs/operations/settings/query-complexity
    observe: Match `query_id` in `system.query_log` to the client request. The log records errors and
      resource counters in `ProfileEvents`. `system.processes` lists running queries.

  - id: parts-backpressure
    title: Active parts per partition
    stage: [writes]
    where: [table-node]
    facets:
      resource: [writes]
      scope: [table]
      behavior: [throttle, reject]
      configuration: [table]
      activity: [query]
    errors: [TOO_MANY_PARTS]
    settings: [parts_to_delay_insert, parts_to_throw_insert, max_avg_part_size_for_too_many_parts,
          min_delay_to_insert_ms, max_delay_to_insert]
    note: Active-part defaults are 1000 for insert delay and 3000 for rejection per partition. The checks
      apply when average part size is at most `max_avg_part_size_for_too_many_parts`. Delay bounds use
      milliseconds for `min_delay_to_insert_ms` and seconds for `max_delay_to_insert`.
    docs: https://clickhouse.com/docs/operations/settings/merge-tree-settings#parts_to_delay_insert
    observe: '`system.parts` and `system.mutations` show table state. `system.query_log` and client errors
      identify delayed or failed operations.'

  - id: partitions-per-insert
    title: Partitions per inserted block
    stage: [writes]
    where: [table-node]
    facets:
      resource: [writes]
      scope: [query]
      behavior: [reject, warn]
      configuration: [profile, query]
      activity: [query]
    errors: [TOO_MANY_PARTS]
    settings: [max_partitions_per_insert_block, throw_on_max_partitions_per_insert_block]
    note: Bounds partitions in one inserted block. With
      `throw_on_max_partitions_per_insert_block`=`true`, an excess fails the insert; `false` logs a
      warning and continues. Zero disables the partition cap.
    docs: https://clickhouse.com/docs/operations/settings/settings#max_partitions_per_insert_block
    observe: Match `query_id` in `system.query_log` to the client request. The log records errors and
      resource counters in `ProfileEvents`. `system.processes` lists running queries.

  - id: mutations-backpressure
    title: Too many mutations
    stage: [writes]
    where: [table-node]
    facets:
      resource: [writes]
      scope: [table]
      behavior: [throttle, reject]
      configuration: [table]
      activity: [query]
    errors: [TOO_MANY_MUTATIONS]
    settings: [number_of_mutations_to_delay, number_of_mutations_to_throw, min_delay_to_mutate_ms,
          max_delay_to_mutate_ms]
    note: Delays or rejects new mutation submissions according to unfinished mutations in the table. Zero
      disables the corresponding count threshold. Delay bounds are milliseconds.
    docs:
      https://clickhouse.com/docs/operations/settings/merge-tree-settings#number_of_mutations_to_delay
    observe: '`system.parts` and `system.mutations` show table state. `system.query_log` and client errors
      identify delayed or failed operations.'

  - id: inactive-parts
    title: Inactive parts per partition
    stage: [writes]
    where: [table-node]
    facets:
      resource: [writes]
      scope: [table]
      behavior: [throttle, reject]
      configuration: [table]
      activity: [query]
    settings: [inactive_parts_to_delay_insert, inactive_parts_to_throw_insert]
    errors: [TOO_MANY_PARTS]
    note: Delays or rejects inserts when inactive parts accumulate in a partition. Zero disables the
      corresponding threshold.
    docs:
      https://clickhouse.com/docs/operations/settings/merge-tree-settings#inactive_parts_to_delay_insert
    observe: '`system.parts` and `system.mutations` show table state. `system.query_log` and client errors
      identify delayed or failed operations.'

  - id: total-parts
    title: Total active parts in a table
    stage: [writes]
    where: [table-node]
    facets:
      resource: [writes]
      scope: [table]
      behavior: [reject]
      configuration: [table]
      activity: [query]
    settings: [max_parts_in_total]
    errors: [TOO_MANY_PARTS]
    note: Rejects inserts when the table’s total active-part count reaches the configured ceiling across
      partitions.
    docs: https://clickhouse.com/docs/operations/settings/merge-tree-settings#max_parts_in_total
    observe: '`system.parts` and `system.mutations` show table state. `system.query_log` and client errors
      identify delayed or failed operations.'

  - id: distributed-insert-buffer
    title: Distributed insert queue bytes
    stage: [writes]
    where: [buffer-node]
    facets:
      resource: [writes, io]
      scope: [table]
      behavior: [throttle, reject]
      configuration: [table]
      activity: [query]
    settings: [bytes_to_delay_insert, bytes_to_throw_insert, max_delay_to_insert]
    errors: [DISTRIBUTED_TOO_MANY_PENDING_BYTES]
    note: For background Distributed inserts, pending compressed bytes trigger delay or rejection on the
      sending-queue node. Zero disables either byte threshold. `max_delay_to_insert` bounds the delay in
      seconds.
    docs: https://clickhouse.com/docs/engines/table-engines/special/distributed
    observe: '`system.distribution_queue` shows pending files and send errors. Client outcomes and `system.query_log`
      entries for completed or failed queries show rejected or delayed inserts.'

  - id: quotas
    title: Quotas
    stage: [start, execution]
    where: [initiator]
    facets:
      resource: [usage]
      scope: [quota]
      behavior: [reject, kill]
      configuration: [quota]
      activity: [query]
    errors: [QUOTA_EXCEEDED]
    settings: [queries, query_selects, query_inserts, errors, read_rows, read_bytes, result_rows,
          result_bytes, written_rows, written_bytes, execution_time, queries_per_normalized_hash]
    note: Accounts usage per quota key and interval on the initiator, including reported remote reads.
      Zero disables a counter’s limit. Multiple initiators maintain independent counters; restart resets
      usage. Query-count ceilings reject new work, while resource counters can fail running queries.
      Keying determines which users or requests share a budget.
    docs: https://clickhouse.com/docs/operations/quotas
    observe: '`system.quota_usage` and `system.quota_limits` show usage and ceilings for the selected interval
      and key.'

  - id: settings-constraints
    title: Settings constraints
    stage: [start]
    where: [initiator]
    facets:
      resource: [access]
      scope: [user]
      behavior: [reject]
      configuration: [profile]
      activity: [policy]
    errors: [SETTING_CONSTRAINT_VIOLATION]
    settings: [min, max, disallowed, const, changeable_in_readonly]
    note: Profile constraints restrict setting values and changes, including workload assignment. Fixing
      workload in a profile keeps scheduling policy attached to that user.
    docs: https://clickhouse.com/docs/operations/settings/constraints-on-settings
    observe: Match `query_id` in `system.query_log` to the client request. The log records errors and
      resource counters in `ProfileEvents`. `system.processes` lists running queries.

  - id: unknown-workload
    title: Unknown workload
    stage: [workload]
    where: [every-node]
    facets:
      resource: [access]
      scope: [server]
      behavior: [reject]
      configuration: [server]
      activity: [policy]
    errors: [RESOURCE_ACCESS_DENIED]
    settings: [throw_on_unknown_workload]
    since: '25.2'
    note: With `throw_on_unknown_workload`=`true`, an unknown workload raises `RESOURCE_ACCESS_DENIED`.
      The default `false` permits unscheduled access for an unknown workload name. Profile constraints
      can restrict selection among known workloads.
    docs:
      https://clickhouse.com/docs/operations/server-configuration-parameters/settings#throw_on_unknown_workload
    observe: Match `query_id` in `system.query_log` to the client request. The log records errors and
      resource counters in `ProfileEvents`. `system.processes` lists running queries.
gaps:
  - when:
      resource: concurrency
      scope: user
      behavior: wait
    note: Per-user concurrency checks reject immediately. A fixed user workload with query slots provides
      admission queueing.
    see: [workload-query-slots, user-concurrency]
  - when:
      resource: concurrency
      scope: query
      behavior: wait
    note: The server or workload defines the shared admission budget. Query settings specify the wait
      deadline.
    see: [server-max-concurrent-queries, workload-query-slots]
  - when:
      resource: memory
      scope: server
      behavior: wait
    note: Foreground admission queueing by memory requires a workload memory reservation. Overcommit
      pauses allocations during execution; merge memory limits defer background work.
    see: [workload-memory, memory-overcommit, merges-memory]
  - when:
      resource: cpu
      scope: user
    note: A fixed user workload provides CPU scheduling and CPU-time throttling.
    see: [workload-cpu-slots, workload-cpu-throttle]
  - when:
      resource: usage
      behavior: wait
    note: Exhausted quotas reject work until the interval resets.
    see: [quotas]
