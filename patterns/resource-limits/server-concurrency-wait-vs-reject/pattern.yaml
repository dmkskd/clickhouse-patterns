manifest_version: 2
metadata:
  title: 'Server concurrency: wait vs reject'
  description: |-
    The server process-list limit `max_concurrent_queries` can queue a query
    for up to `queue_max_wait_ms`. A free slot admits the query; expiry of the
    wait budget rejects it with `TOO_MANY_SIMULTANEOUS_QUERIES`.
    The default wait budget of zero rejects an excess query immediately.

    `max_concurrent_select_queries`, `max_concurrent_insert_queries`,
    `max_concurrent_queries_for_user`, and `max_concurrent_queries_for_all_users`
    reject immediately at their own checks. A query can already have waited
    at the preceding server-wide check.

    Server `max_waiting_queries` bounds the table-loading queue at startup.
    Workload query slots provide a separate admission queue before the
    process-list checks.
  graph: |-
    admission:
      client:readers(note=Client processes\nSubmit concurrent SELECT queries) -[max_concurrent_queries]-> mergetree:events
  mode: reference
  status: wip
  topology: single
  order: 1
  tags: [max_concurrent_queries, queue_max_wait_ms, too_many_simultaneous_queries, admission]
  references:
    - label: 'ClickHouse: max_concurrent_queries'
      url: https://clickhouse.com/docs/operations/server-configuration-parameters/settings#max_concurrent_queries
    - label: 'ClickHouse source: ProcessList::insert'
      url: https://github.com/ClickHouse/ClickHouse/blob/master/src/Interpreters/ProcessList.cpp
  tradeoffs:
    benefits:
      - A positive `queue_max_wait_ms` queues excess queries during short bursts.
    limitations:
      - The server-wide queue shares admission capacity across users. Workload query slots provide workload-specific scheduling.
      - Queued queries keep their client connections open.
