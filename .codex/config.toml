[mcp_servers.clickhouse-patterns]
command = "uv"
args = ["run", "--no-project", "--with", "mcp-clickhouse", "--python", "3.12", "mcp-clickhouse"]
enabled = true
required = false
enabled_tools = ["list_databases", "list_tables", "run_query"]
default_tools_approval_mode = "approve"

[mcp_servers.clickhouse-patterns.env]
CLICKHOUSE_ALLOW_WRITE_ACCESS = "false"
CLICKHOUSE_HOST = "localhost"
CLICKHOUSE_PASSWORD = ""
CLICKHOUSE_PORT = "8123"
CLICKHOUSE_SECURE = "false"
CLICKHOUSE_USER = "default"
CLICKHOUSE_VERIFY = "false"
